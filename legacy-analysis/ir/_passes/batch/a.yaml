  - capability_key: order-reporting-batch
    record_keys: [ORDB-REQ-0006]
    severity: high
    category: data-corruption
    title: Purge skips orders without contact information and may remove shared records
    description: >
      The purge selects orders through an inner join on contact_info, so a COMPLETED or DENIED order with no contact row is never purged. Address and card rows are deleted by the id found on the order, with no check that another order still references them. Order cut-off and extract are only linked by schedule, not by checking that each purged order was extracted.
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 10
        line_end: 24
  - capability_key: inventory-reporting
    record_keys: [INVR-REQ-0004]
    severity: high
    category: data-corruption
    title: Previous backup folder removed before new backup is confirmed
    description: >
      The script deletes the undated PetStoreDB folder and later the same-day dated folder; a rerun on the same day after a failed or partial backup deletes the earlier same-day backup before the replacement is moved in. Only backups older than 7 days are otherwise retained.
    traces:
      - path: legacy-source/batch/ps_db_backup.sh
        line_start: 7
        line_end: 10
  - capability_key: inventory-reporting
    record_keys: [INVR-REQ-0001]
    severity: low
    category: other
    title: Low-stock report silently omits items without English description
    description: >
      The report joins item_details on locale en_US with an inner join, so low-stock items missing an English description do not appear, while the totals still count them.
    traces:
      - path: legacy-source/db/batch/inventory_report.sql
        line_start: 3
        line_end: 7
  - capability_key: inventory-reporting
    record_keys: [INVR-REQ-0003]
    severity: low
    category: other
    title: First-load trigger matches any "does not exist" output
    description: >
      The populate request is triggered by any ij output containing "does not exist", not specifically missing catalog tables; a different missing object would also trigger a populate request.
    traces:
