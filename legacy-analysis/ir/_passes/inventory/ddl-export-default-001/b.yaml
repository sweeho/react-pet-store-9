  - record_key: REPORT-REQ-0010
    kind: requirement
    capability_key: order-reporting-batch
    requirement: The system SHALL support retrieval of purchase orders by user and by order date.
    plain_text: Orders can be looked up quickly by customer and by date.
    technical_note: Indexes ix_po_user (po_user_id) and ix_po_date (po_date) on purchase_order; performance structures supporting queries and the date-based batch jobs.
    interface: false
    confidence: low
    confidence_basis: Indexes show intended access paths only; the consuming queries were not read.
    risk_class: operational
    basis: Two indexes on purchase_order.
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: ix_po_user
