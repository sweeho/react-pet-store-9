findings: []
suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [FULFILL-ENT-0006, FULFILL-REQ-0008]
    severity: low
    category: data-corruption
    title: Order line and inventory item references are not enforced
    description: >
      po_line_item category_id, product_id and item_id and inventory.item_id have no foreign keys to the
      catalog, so lines or stock rows can reference items that do not exist. Inventory has no non-negative check.
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: po_line_item
        line_start: 161
        line_end: 171
        excerpt: |
          constraint fk_po_line_item_1 foreign key (po_id) references purchase_order (po_id));
