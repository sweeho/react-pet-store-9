    capability_key: order-fulfillment
    requirement: The system SHALL hold one inventory quantity per item, mandatory.
    plain_text: Stock on hand is tracked as one number per item.
    technical_note: inventory table PK item_id, quantity integer NOT NULL. No CHECK for non-negative and no FK to item.
    interface: false
    confidence: medium
    confidence_basis: One clear place; no non-negativity rule visible in DDL.
    risk_class: operational
    basis: inventory definition.
    traces:
      - kind: db_object
        path: petstore_oracle.sql
        anchor: inventory
        line_start: 206
        line_end: 209
        excerpt: |
          CREATE TABLE inventory (
            item_id varchar2(10) not null,
            quantity integer not null,
            constraint pk_inventory primary key (item_id));
    stack_metadata:
      db.object: inventory
      db.kind: table
