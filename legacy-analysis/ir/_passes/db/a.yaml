records:
  - record_key: CATB-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL hold the catalog as categories, products and items, where each product belongs to exactly one category and each item belongs to exactly one product, and SHALL keep names, descriptions and images per locale in separate detail records keyed by identifier and locale.
    plain_text: >
      The catalog is organised as pet categories containing products containing individual sellable pets, with the wording, pictures and prices held separately for each language.
    technical_note: >
      Tables category, category_details (PK catid+locale), product, product_details, item, item_details (PK itemid+locale) with foreign keys fk_product_1, fk_item_1 and the *_details FKs. Loaded from PopulateSQL.xml.
    interface: false
    confidence: high
    confidence_basis: >
      Primary and foreign keys declared in both DDL scripts and the header comment names the populate source; two places.
    risk_class: operational
    basis: Primary keys and foreign keys in the DDL define the hierarchy and locale split.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 13
        line_end: 70
        excerpt: |
          CREATE TABLE category (
            catid varchar2(10) not null,
            constraint pk_category primary key (catid));
    stack_metadata:
      db.object: category, category_details, product, product_details, item, item_details
  - record_key: CATB-RULE-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL require every item locale record to carry a list price, a unit cost, an image and a description.
    plain_text: >
      Every item shown in a language must have a selling price, a supplier cost, a picture and a description.
    technical_note: >
      item_details.listprice, unitcost, image, descn are NOT NULL; prices are decimal(10,2).
    interface: false
    confidence: medium
    confidence_basis: One clear place, the DDL.
    risk_class: financial
    basis: NOT NULL constraints on price and text columns.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 57
        line_end: 70
        excerpt: |
          listprice decimal(10,2) not null,
          unitcost decimal(10,2) not null,
          locale varchar2(10) not null,
          image varchar2(255) not null,
          descn varchar2(255) not null,
    stack_metadata:
      db.object: item_details
  - record_key: CATB-RULE-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The catalog consistency check SHALL report every category with no product (C1), every product with no item (C2), every item whose list price is below its unit cost (C3), every item missing a description in a locale served for its category (C4), and every item with no supplier inventory record (C5), and SHALL fail the job when any such row is found.
    plain_text: >
      A nightly catalog check lists categories without products, products without pets, pets priced below cost, pets lacking a description in a supported language, and pets the supplier does not stock; any finding fails the job.
    technical_note: >
      db/batch/catalog_check.sql, five SELECTs; header says the script fails the job with code 4 when a row starts with C1 to C5. C4 derives the locales from category_details for the item's category, not from a fixed list, although the comment names en_US, ja_JP, zh_CN.
    interface: false
    confidence: high
    confidence_basis: SQL plus runbook section 3.6 describing the same five checks.
    risk_class: operational
    basis: The SQL checks and the runbook description agree.
    traces:
      - path: legacy-source/db/batch/catalog_check.sql
        line_start: 1
        line_end: 17
        excerpt: |
          -- PS_CATALOG_CHECK: catalog integrity checks. Each query must return 0 rows;
          -- the script fails the job (code 4) when any row starts with C1 to C5.
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1 (3.6 PS_CATALOG_CHECK)
        excerpt: "Runs catalog checks C1 to C5 ... Exit code 4 means a check found rows"
    stack_metadata:
      db.object: category, product, item, item_details, category_details, inventory
      batch.trigger: PS_CATALOG_CHECK
