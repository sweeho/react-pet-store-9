suspected_defects:
  - capability_key: customer-account
    record_keys: [CUST-RULE-0002]
    severity: high
    category: data-corruption
    title: Passwords stored in plain text
    description: >
      The schema comment states the sign-on password column is plain text.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 72
        line_end: 73
  - capability_key: order-checkout
    record_keys: [CHKO-ENT-0001]
    severity: high
    category: other
    title: Card numbers stored in clear
    description: >
      The schema comment states card numbers are stored unencrypted, and the purge only removes them after 180 days.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 103
        line_end: 104
  - capability_key: catalog-browsing
    record_keys: [CATB-RULE-0003, CATB-RULE-0002]
    severity: medium
    category: other
    title: Catalog check C3 fails on shipped sample data
    description: >
      The schema notes that sample data has item EST-26 (ja_JP) priced below cost and the table has no price check, so the nightly C3 check fails on shipped data.
    traces:
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 230
        line_end: 231
      - path: legacy-source/db/batch/catalog_check.sql
        line_start: 9
        line_end: 10
  - capability_key: order-reporting-batch
    record_keys: [ORDB-RULE-0002]
    severity: medium
    category: data-corruption
    title: Purge leaves supplier-order contact records behind
    description: >
      The purge deletes only the contact_info rows referenced by the purchase order. supplier_order.contact_id also references contact_info, and if it points to a different row that row is not deleted, leaving personal data after retention.
    traces:
      - path: legacy-source/db/batch/order_purge.sql
        line_start: 19
        line_end: 25
      - path: legacy-source/db/schema/petstore_oracle.sql
        line_start: 182
        line_end: 188
findings:
  - kind: ambiguity
    path: legacy-source/db/batch/catalog_check.sql
    description: >
      Comment lists locales en_US, ja_JP, zh_CN as served, but C4 derives locales from category_details rows. A human should confirm which defines the supported locales.
  - kind: ambiguity
    path: legacy-source/db/schema/petstore_cloudscape.sql
    description: >
      A second DDL variant (Cloudscape/Derby) exists beside the Oracle one; the batch scripts target Derby while the Oracle script is labelled reference production. Not diffed in this pass; which is authoritative needs confirmation.
