records:
  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL hold each customer's cart as a per-session set of item identifiers mapped to quantities, with at most one line per item.
    confidence: high
    confidence_basis: Stateful session bean declaration in the deployment descriptor plus map-based storage in the bean; two places agree.
    risk_class: operational
    plain_text: A customer's cart keeps one line per product item with a quantity, for the length of their shopping session.
    technical_note: ShoppingCartLocalEJB keeps a HashMap itemId->Integer; declared Stateful in ejb-jar.xml. Cart is not persisted.
    interface: false
    basis: Cart storage is a HashMap keyed by item id; stateful session type.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
              private HashMap cart;
              // default to the US English
              private Locale locale = Locale.US;

              public ShoppingCartLocalEJB() {
                  cart = new HashMap();
              }
      - path: legacy-source/app/src/components/cart/src/ejb-jar.xml
        line_start: 49
        line_end: 54
        excerpt: |
          <ejb-name>ShoppingCartEJB</ejb-name>
    stack_metadata:
      framework: EJB
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required
      session.scope: Stateful
  - record_key: CART-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL allow adding an item to the cart with quantity 1 by default or with a specified quantity; adding an item already in the cart replaces its quantity rather than increasing it.
    confidence: medium
    confidence_basis: One clear place; the replace-not-accumulate behaviour is read from put semantics, no test or doc.
    risk_class: operational
    plain_text: Adding a product puts it in the cart with quantity one unless a quantity is given. Adding it again resets the quantity instead of adding to it.
    technical_note: addItem(String) and addItem(String,int) call HashMap.put. No validation of qty (zero or negative accepted on add).
    interface: false
    basis: addItem overloads.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
