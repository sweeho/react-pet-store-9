  - record_key: CART-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: The system SHALL compute the cart subtotal as the sum over lines of unit list cost multiplied by quantity, with no discount, tax or rounding applied.
    confidence: high
    confidence_basis: Computed in two places (bean subtotal, model total) with the same formula.
    risk_class: financial
    plain_text: The cart subtotal is the sum of price times quantity for every line, with no tax, discount or rounding.
    technical_note: Bean getSubTotal and ShoppingCartModel.getTotalCost/CartItem.getTotalCost use double arithmetic.
    interface: false
    basis: Subtotal loops.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
              return total;
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
  - record_key: CART-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN a cart item whose catalog lookup fails WHEN the cart lines are listed THEN the system SHALL omit that line, and therefore exclude it from the subtotal, without informing the customer.
    confidence: medium
    confidence_basis: One clear place; intent not documented.
    dispute:
      reason: other
      detail: Unclear whether silently dropping unresolved items is intended; a business owner should decide.
    risk_class: financial
    plain_text: If a product in the cart can no longer be found in the catalog, it silently disappears from the cart view and total.
    technical_note: CatalogException is caught, printed to stdout, and the loop continues.
    interface: false
    basis: catch block in getItems.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 104
        line_end: 106
        excerpt: |
          } catch (CatalogException cce) {
              System.out.println("ShoppingCartEJB caught: " + cce);
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
