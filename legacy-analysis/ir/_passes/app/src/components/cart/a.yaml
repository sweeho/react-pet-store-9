  - record_key: CART-BR-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN an item in the cart WHEN its quantity is updated to a value less than or equal to zero THEN the system SHALL remove the item from the cart; otherwise the system SHALL set the quantity to the new value.
    confidence: high
    confidence_basis: Explicit code plus an explanatory comment.
    risk_class: operational
    plain_text: Setting a product's quantity to zero or less takes it out of the cart; any other number replaces the quantity.
    technical_note: updateItemQuantity removes then re-puts only when newQty > 0. Note an update for an item not in the cart adds it.
    interface: false
    basis: updateItemQuantity with comment.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
