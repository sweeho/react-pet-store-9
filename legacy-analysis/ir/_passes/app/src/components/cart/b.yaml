records:
  - record_key: SHOPPING-CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL keep a per-shopper cart that maps each item identifier to a single integer quantity, starting empty, and SHALL hold at most one entry per item.
    plain_text: Each shopper has their own cart that starts empty and lists each item once with a quantity.
    technical_note: Stateful session bean holding a HashMap of itemId to Integer; created empty in constructor and ejbCreate.
    interface: false
    confidence: high
    confidence_basis: Map initialised in two places (constructor and ejbCreate) and the descriptor declares the bean stateful; one source file, so no independent second place beyond descriptor.
    risk_class: operational
    basis: The cart state is a HashMap keyed by item id with Integer values.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
          private HashMap cart;
          // default to the US English
          private Locale locale = Locale.US;

          public ShoppingCartLocalEJB() {
              cart = new HashMap();
          }
      - path: legacy-source/app/src/components/cart/src/ejb-jar.xml
        line_start: 53
        line_end: 54
        excerpt: |
          <session-type>Stateful</session-type>
          <transaction-type>Container</transaction-type>
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Container
      session.scope: Stateful

  - record_key: SHOPPING-CART-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL allow an item to be added to the cart with a default quantity of 1, or with a caller-specified quantity.
    plain_text: A shopper can add an item to the cart; unless told otherwise, one unit is added.
    technical_note: addItem(itemID) puts quantity 1; addItem(itemID, qty) puts qty. No validation of qty.
    interface: false
    confidence: high
    confidence_basis: Two overloads plus transaction descriptor entry for addItem; user guide describes Add to Cart.
    risk_class: operational
    basis: Two addItem overloads.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }

          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 48
        line_end: 48
        excerpt: "2. Click Add to Cart in the row of the Male Adult Bulldog."
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required

  - record_key: SHOPPING-CART-BR-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN an item already in the cart WHEN it is added again THEN the system SHALL replace the existing quantity with the new quantity (1 by default) rather than accumulate it.
    plain_text: Adding an item that is already in the cart resets its quantity instead of adding to it.
    technical_note: HashMap.put overwrites the prior value.
    interface: false
    confidence: medium
    confidence_basis: Follows from put semantics in one place; no test or doc confirms it is intended.
    risk_class: operational
    basis: Overwrite semantics of put in both addItem overloads.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 117
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }
    stack_metadata:
      framework: EJB 2.x

  - record_key: SHOPPING-CART-REQ-0004
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL allow an item to be removed from the cart, and removing an item not in the cart SHALL have no effect.
    plain_text: A shopper can remove an item from the cart.
    technical_note: deleteItem calls HashMap.remove; absent key is a no-op.
    interface: false
    confidence: high
    confidence_basis: Direct implementation plus declared transaction attribute in descriptor.
    risk_class: operational
    basis: deleteItem implementation.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 121
        excerpt: |
          public void deleteItem (String itemID) {
              cart.remove(itemID);
          }
    stack_metadata:
      framework: EJB 2.x
      ejb.transaction: Required

  - record_key: SHOPPING-CART-BR-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN an item quantity update WHEN the new quantity is greater than zero THEN the system SHALL set the item to that quantity; WHEN the new quantity is zero or negative THEN the system SHALL remove the item from the cart.
    plain_text: Changing an item's quantity to zero or less takes it out of the cart.
    technical_note: updateItemQuantity removes the key then re-puts only if newQty > 0. An update for an item not in the cart adds it.
    interface: false
    confidence: high
    confidence_basis: Explicit code comment and condition; descriptor entry for the method.
    risk_class: operational
    basis: Comment "remove item if it is less than or equal to 0".
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              // remove item if it is less than or equal to 0
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }
    stack_metadata:
      framework: EJB 2.x
      ejb.transaction: Required

