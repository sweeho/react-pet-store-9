  - record_key: SHOPPING-CART-REQ-0007
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL present each cart line with item id, product id, category, product name, attribute, quantity and unit cost, where name, attribute and unit cost come from the catalog in the shopper's selected locale and the unit cost is the item's list cost.
    plain_text: The cart shows each item with its description and the shelf (list) price, in the shopper's language, and the quantity chosen.
    technical_note: getItems looks up each cart key via CatalogHelper using the bean's locale (default US English) and builds CartItem objects. Locale set via setLocale.
