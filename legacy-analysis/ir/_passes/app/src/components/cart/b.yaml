findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      The empty-cart order rejection listed in the capability summary is not in this module; it must live in the order or web tier. The user guide's two-price description (List Price vs members' Your Price) is not reflected here: the cart uses list cost only. A human should confirm which price an order is charged.

