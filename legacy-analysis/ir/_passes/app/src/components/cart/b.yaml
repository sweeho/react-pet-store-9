  - record_key: SHOPPING-CART-BR-0008
    kind: business-rule
    capability_key: shopping-cart
    requirement: The system SHALL compute a line total as quantity multiplied by unit cost, the cart subtotal as the sum of line totals, using floating-point arithmetic with no rounding applied.
    plain_text: Each line is quantity times price and the cart total is the sum of the lines.
    technical_note: Computed in three places - CartItem.getTotalCost, ShoppingCartModel.getTotalCost and ShoppingCartLocalEJB.getSubTotal (the latter recomputes quantity*unitCost directly). double type, no rounding or currency scale.
    interface: false
    confidence: high
    confidence_basis: Same calculation in three places.
    risk_class: financial
    basis: Arithmetic in the three classes.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/CartItem.java
        line_start: 95
        line_end: 97
        excerpt: |
          public double getTotalCost() {
              return quantity * unitCost;
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
              return total;
          }
    stack_metadata:
      framework: EJB 2.x

  - record_key: SHOPPING-CART-BR-0009
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN a cart item that cannot be found in the catalog WHEN the cart is listed or totalled THEN the system SHALL omit that item from the listed lines and the subtotal without notifying the shopper.
    plain_text: If an item in the cart is no longer in the catalog, it silently drops out of the cart view and the total.
    technical_note: CatalogException is caught, printed to stdout and the loop continues; the item stays in the underlying map (still counted by getCount).
    interface: false
    confidence: medium
    confidence_basis: One clear catch block; behaviour for other cart operations inferred.
    risk_class: financial
    basis: catch (CatalogException) with System.out.println only.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 104
        line_end: 106
        excerpt: |
          } catch (CatalogException cce) {
              System.out.println("ShoppingCartEJB caught: " + cce);
          }
    stack_metadata:
      framework: EJB 2.x

