              CartItem ci = new CartItem(item.getItemId(),
                                     item.getProductId(),
                                     item.getCategory(),
                                     item.getProductName(),
                                     item.getAttribute(),
                                     value.intValue(),
                                     item.getListCost());
              items.add(ci);
    stack_metadata:
