  - capability_key: shopping-cart
    record_keys: [SHOPPING-CART-BR-0009]
    severity: medium
    category: error-swallowed
    title: Missing catalog items silently vanish from cart and total
    description: >
      Catalog lookup failure is logged to stdout only; the item is dropped from the displayed lines and subtotal but remains in the cart count.
