    record_keys: [ORDER-NOTIFICATIONS-BR-0003]
    severity: medium
    category: error-swallowed
    title: Mail delivery failures are swallowed
    description: >
      Any failure to send is ignored with only a stderr line; the customer is never notified and nothing is retried or recorded.
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 83
        line_end: 85
  - capability_key: order-notifications
    record_keys: [ORDER-NOTIFICATIONS-REQ-0002]
    severity: low
    category: other
    title: Locale is accepted but never used
    description: >
      The MDB passes Locale.getDefault() into the helper, which ignores it; mail content is not localised here.
    traces:
      - path: legacy-source/app/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 70
        line_end: 70
