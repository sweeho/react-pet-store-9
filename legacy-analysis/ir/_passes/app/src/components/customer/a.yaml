  - record_key: CUSTA-BR-0004
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN a customer, account or profile is removed, the system SHALL also remove its dependent account, profile, contact information, address and credit card.
    confidence: medium
    confidence_basis: Declared cascade-delete in relationship config only; the bean ejbRemove methods are empty.
    risk_class: operational
    basis: Relationship roles on Account, Profile, ContactInfo and CreditCard carry cascade-delete.
    plain_text: >
      Deleting a customer deletes everything stored about them.
    technical_note: >
      ejb-jar.xml ejb-relation entries with cascade-delete on the dependent side.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/ejb-jar.xml
        line_start: 277
        line_end: 285
        excerpt: |
          <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
          <multiplicity>One</multiplicity>
          <cascade-delete />
    stack_metadata:
      framework: EJB 2.0 CMP
