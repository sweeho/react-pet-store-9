        line_start: 81
        line_end: 87
        excerpt: |
          <ejb-ql>Select OBJECT(a) From Customer a</ejb-ql>
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: CustomerEJB
  - record_key: CUSTA-BR-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN a customer is created, the system SHALL automatically create an account with status "active", and SHALL create a profile with default preferences.
    confidence: medium
    confidence_basis: One clear place (ejbPostCreate); the user guide only says a new user is created on sign-up, not these defaults.
    risk_class: operational
    basis: ejbPostCreate creates Account with Active status and Profile with defaults.
    plain_text: >
      A newly registered customer starts with an active account and default preferences.
    technical_note: >
      CustomerEJB.ejbPostCreate looks up Account and Profile local homes via JNDI; NamingException becomes CreateException.
    interface: false
    traces:
