  - record_key: CUSTA-ENT-0003
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL hold for each account a status of either "active" or "disabled", one contact-information record and one credit-card record; a new account has empty contact and credit-card records created with it.
    confidence: medium
    confidence_basis: Status constants and creation in one bean plus relationship config; no code in this module that acts on "disabled".
    risk_class: operational
    basis: AccountLocalHome defines Active/Disabled; AccountEJB.ejbPostCreate creates blank contact info and credit card.
    plain_text: >
      An account is either active or disabled and holds the customer's contact details and payment card.
    technical_note: >
      AccountEJB CMP; CMR contactInfo and creditCard with cascade-delete in ejb-jar.xml. Disabled value is declared but not enforced in this module.
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
