  - record_key: CUSTA-ENT-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL represent a customer as an identified record keyed by a user id, owning exactly one account and exactly one profile.
    confidence: high
    confidence_basis: >
      Declared in the CMP bean class and in the ejb-jar relationships (two places).
    risk_class: operational
    basis: Customer entity has userId plus one-to-one links to account and profile; finder returns all customers.
    plain_text: >
      Every customer has a user id, one account and one set of preferences.
    technical_note: >
      CustomerEJB CMP bean, CMR fields account/profile, finder findAllCustomers (EJB-QL select all).
    interface: false
    traces:
      - path: legacy-source/app/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 57
        line_end: 65
        excerpt: |
