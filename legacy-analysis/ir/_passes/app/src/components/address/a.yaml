      Field list appears in the persistence descriptor, the bean's abstract accessors and the DTD, so three places agree on the fields (the DTD differs on optionality, see ORDER-CHECKOUT-BR-0001).
    risk_class: operational
    basis: >
      Container-managed fields are declared in the deployment descriptor and mirrored by accessors on the bean.
    plain_text: >
      An address consists of two street lines, a city, a state, a zip code and a country.
    technical_note: >
      AddressEJB is a CMP 2.x entity bean with cmp-fields zipCode, streetName2, state, streetName1, city, country. Used as the shipping/billing address stored for an order; the owning order component is outside this shard.
