  - record_key: ORDER-CHECKOUT-BR-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The system SHALL treat street name 1, city, state and zip code as mandatory, and street name 2 and country as optional, in the address interchange format.
    confidence: low
    confidence_basis: >
      Only the DTD declares this and the DTD is for an XML exchange format; the bean itself enforces nothing and no caller was seen in this shard. DTD names a single StreetName element (twice), not the street1/street2 names used by the bean.
    risk_class: operational
    basis: >
      DTD content model Address (StreetName, StreetName?, City, State, ZipCode, Country?).
    plain_text: >
      When an address is exchanged as a document, a street, city, state and zip code must be present; a second street line and the country may be left out.
    technical_note: >
      Address.dtd only. The bean's ejbCreate accepts nulls without validation. Whether any document producer or consumer validates against this DTD is not established here.
    interface: true
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
    stack_metadata:
      framework: DTD
  - record_key: ORDER-CHECKOUT-REQ-0001
    kind: requirement
    capability_key: order-checkout
    requirement: >
      The system SHALL store an address from either six individual values or a copy of another address, without validating or altering the values, and SHALL be able to return the stored values as a copy.
    confidence: medium
    confidence_basis: >
      Read in one class (creation and data-return methods); no tests or other enforcement seen. The absence of validation is inferred from the code.
    risk_class: operational
    basis: >
      ejbCreate overloads copy every field verbatim; getData returns a new Address with the six fields.
    plain_text: >
      An address is saved exactly as entered, with no checks on its content, and can be read back in full.
    technical_note: >
      ejbCreate(six strings), ejbCreate(Address) and no-arg ejbCreate (leaves fields unset); getData builds an Address transfer object. No transaction attribute declared in this file's excerpt.
    interface: false
