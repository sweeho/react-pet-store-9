  - record_key: ORDER-REPORTING-BATCH-BR-0001
    kind: business-rule
    capability_key: order-reporting-batch
    requirement: >
      The system SHALL delete the addresses of an order together with the order when a completed or denied order older than 180 days is purged.
    confidence: low
    confidence_basis: >
      Stated only in the operations runbook; the purge job is outside this module and was not read here, so the code side is unverified.
    risk_class: regulated
    basis: >
      Runbook section 3.5 lists addresses among records removed with the order.
    plain_text: >
      When old finished or denied orders are removed, their addresses are removed too.
    technical_note: >
      Enforced by the PS_ORDER_PURGE job, not by this component. The address bean's ejbRemove is empty.
