  - record_key: ORDER-CHECKOUT-REQ-0006
    kind: requirement
    capability_key: order-checkout
    requirement: >
      GIVEN an order is purged WHEN it is COMPLETED or DENIED and older than 180 days THEN the system SHALL delete its addresses together with the order.
    plain_text: >
      Addresses belonging to old completed or denied orders are deleted when those orders are purged.
    technical_note: >
      Documented in the operations runbook; the deletion is performed by the batch job, not by this module. Filed under order-checkout as the closest listed home (purge belongs to order-reporting-batch).
    interface: false
    confidence: low
    confidence_basis: Document only; no code in this module implements it.
    risk_class: regulated
    basis: Runbook purge description.
    traces:
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        anchor: p1
        excerpt: |
          Deletes COMPLETED and DENIED orders older than 180 days, with their order lines, supplier orders,
          contact information, addresses and payment cards.
suspected_defects:
  - capability_key: order-checkout
    record_keys: [ORDER-CHECKOUT-REQ-0004, ORDER-CHECKOUT-REQ-0005]
    severity: low
    category: other
    title: DTD marks Country optional but parser requires it
    description: >
      The Address DTD declares Country optional, yet fromDOM reads it as mandatory, so a DTD-valid address without Country is rejected.
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 173
        line_end: 174
