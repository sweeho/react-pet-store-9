  - record_key: ORDER-CHECKOUT-REQ-0005
    kind: integration
    capability_key: order-checkout
    requirement: >
      The system SHALL reject an incoming XML address whose root is not an Address element or which lacks street name, city, state, zip code or country in order, and SHALL treat the second street name as optional.
    plain_text: >
      An address received in an XML document is refused if it is not an address or if a required part, including country, is missing.
    technical_note: >
      Address.fromDOM throws XMLDocumentException; the Country lookup is passed optional=false.
    interface: true
    confidence: medium
    confidence_basis: One clear place; strictness of the false flag inferred from the XMLDocumentUtils signature name, not read in this pass.
    risk_class: operational
