  - record_key: ORDER-CHECKOUT-REQ-0002
    kind: requirement
    capability_key: order-checkout
    requirement: >
      The system SHALL accept creation of an address from six field values, from another address object, or empty, and SHALL store the values as given without validation.
    plain_text: >
      An address can be saved exactly as entered; the address component itself does not check that any part is filled in or well formed.
    technical_note: >
      ejbCreate overloads copy values straight into CMP fields; no checks, throws no CreateException. Validation, if any, is in callers (outside this module).
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place (create methods); absence of validation is inferred from reading this module only.
    risk_class: operational
    basis: ejbCreate implementations.
