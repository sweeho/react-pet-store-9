    capability_key: order-checkout
    requirement: >
      The system SHALL hold a postal address as six persisted fields: street line 1, street line 2, city, state, zip code and country.
    plain_text: >
      An address consists of two street lines, a city, a state, a zip code and a country.
    technical_note: >
      Container-managed entity bean AddressEJB with six cmp-fields; no length, not-null or format constraint is declared anywhere.
    interface: false
    confidence: high
