    plain_text: >
      When an address is sent to another system in an XML document, the second street line appears only if it has a value.
    technical_note: >
      Address.toDOM; element order StreetName, [StreetName], City, State, ZipCode, Country. Used by shared XML documents (e.g. purchase orders); callers outside this module.
