  - record_key: ORDER-CHECKOUT-REQ-0003
    kind: requirement
    capability_key: order-checkout
    requirement: >
      The system SHALL allow any caller to create, read and remove addresses without role restriction, running under the caller's identity.
    plain_text: >
      Address data can be read and changed by any part of the application without a specific permission.
    technical_note: >
      ejb-jar method-permission is unchecked for local methods; security-identity is use-caller-identity. Only local interfaces exist, so access is in-container.
    interface: false
    confidence: medium
    confidence_basis: One declarative place (ejb-jar.xml); not seen exercised by callers.
    risk_class: operational
    basis: Declarative method permissions.
