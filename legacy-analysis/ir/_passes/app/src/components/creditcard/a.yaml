  - record_key: ORDCHK-BR-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The system SHALL store the card expiry as a single "MM/YYYY"-style text with a slash separator, and SHALL derive the expiry month from the text before the slash and the expiry year from the text after it.
    confidence: medium
    confidence_basis: >
      One clear place (the bean's accessor methods); the exact format is inferred from the slash parsing, no documentation or test.
    risk_class: regulated
    basis: >
      getExpiryMonth/getExpiryYear split on the first slash.
    plain_text: >
      A card's expiry is kept as month and year separated by a slash, and the month and year are read from either side of it.
    technical_note: >
      CreditCardEJB.getExpiryMonth / getExpiryYear use indexOf("/"). No range or past-date check in this module.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          int slashStart = dateString.indexOf("/");
          if (slashStart != -1) return dateString.substring(0,slashStart);
          ...
          if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
    stack_metadata:
      ejb.bean: CreditCardEJB
  - record_key: ORDCHK-BR-0002
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      GIVEN a stored expiry that is absent or has no slash WHEN the expiry month or year is requested THEN the system SHALL return month "01" and year "2010" respectively.
    confidence: low
    confidence_basis: >
      Bare literal defaults with no comment, test or document; reachability from checkout not established in this module.
    risk_class: regulated
    basis: >
      Fallback return values in the accessors; no authoritative source for the choice of values.
    plain_text: >
      If a card's expiry is missing or not in month/year form, it is treated as January 2010.
    technical_note: >
      Fallback literals "01" and "2010" in CreditCardEJB; callers are outside this module.
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 95
        line_end: 106
        excerpt: |
          return "01";
          ...
          return "2010";
    stack_metadata:
      ejb.bean: CreditCardEJB
