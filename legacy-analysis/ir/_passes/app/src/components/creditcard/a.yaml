    kind: requirement
    capability_key: order-checkout
    requirement: >
      The system SHALL accept a card number, card type and expiry date at creation, from either separate values or a card data object, and SHALL store them without validating them.
    confidence: medium
    confidence_basis: >
      One clear place: create methods copy values straight to fields; absence of validation is inferred from reading the whole module.
    risk_class: regulated
    basis: >
      ejbCreate overloads copy inputs; no checks present.
    plain_text: >
      A payment card can be saved from the details entered at checkout, and whatever is given is kept as is.
    technical_note: >
      Three ejbCreate overloads (values, CreditCard data object, no-arg that leaves fields unset). Validation, if any, must be upstream of this component.
