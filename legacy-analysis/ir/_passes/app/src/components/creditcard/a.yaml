  - record_key: ORDRPT-REQ-0001
    kind: requirement
    capability_key: order-reporting-batch
    requirement: >
      The system SHALL delete stored payment cards together with an order when the weekly purge removes a COMPLETED or DENIED order older than 180 days.
    confidence: low
    confidence_basis: >
      Stated only in the runbook; the purge code is outside this module so it was not verified here.
    risk_class: regulated
    basis: >
      Operations runbook describes the purge deleting payment cards with the order.
    plain_text: >
      Saved payment cards are removed along with old completed or denied orders in the weekly clean-up.
    technical_note: >
      Batch PS_ORDER_PURGE (Sundays); this module only supplies the card entity.
    interface: false
    traces:
