  - record_key: ORDCHK-ENT-0001
    kind: entity
    capability_key: order-checkout
    requirement: >
      The system SHALL represent a payment card as three attributes: card number, card type and expiry date, each held as text.
    confidence: high
    confidence_basis: >
      Declared in the persistence descriptor, the bean class and the XML schema, three places agreeing.
    risk_class: regulated
    basis: >
      Three persistent fields in descriptor, abstract accessors in the bean, and DTD element sequence.
    plain_text: >
      A payment card is recorded with its number, its type and its expiry date.
    technical_note: >
      CMP 2.x entity CreditCardEJB with cmp-fields cardNumber, cardType, expiryDate; the DTD defines the same three elements. No format, length or Luhn validation exists in this module.
    interface: true
    traces:
