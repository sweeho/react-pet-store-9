suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDER-APPROVAL-BUSINESS-RULE-0002]
    severity: low
    category: error-swallowed
    title: Connection close errors are silently ignored
    description: >
      Failures while closing the queue connection are swallowed with an empty catch; send errors are only printed to standard error before being rethrown.
    traces:
      - path: legacy-source/app/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 84
