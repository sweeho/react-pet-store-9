records:
  - record_key: ORDF-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL resolve named infrastructure resources (local and remote component homes, message queues and topics with their connection factories, data sources, and URL, boolean and string configuration entries) by name through a central lookup service rather than each caller locating them itself.
    confidence: high
    confidence_basis: >
      Both the EJB-tier and web-tier implementations expose the same set of lookups, and class comments state the purpose. No callers were in this shard, and no document mentions it.
    risk_class: operational
    basis: >
      Two implementations of the Service Locator pattern with identical lookup operations. Fits no listed capability exactly; filed under order-fulfillment because the queues and data sources it resolves serve supplier and order processing.
    plain_text: >
      The application finds its shared resources, such as message queues, databases and configuration settings, in one central place by name.
    technical_note: >
      JNDI InitialContext lookups in ejb/ServiceLocator.java and web/ServiceLocator.java.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 56
        line_end: 60
        excerpt: |
          /**
           *  This class is an implementation of the Service Locator pattern. It is
           *  used to looukup resources such as EJBHomes, JMS Destinations, etc.
           */
          public class ServiceLocator {
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
