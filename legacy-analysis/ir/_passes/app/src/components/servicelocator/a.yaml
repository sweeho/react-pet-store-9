  - record_key: ORDF-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN any lookup fails for any reason (name not found, wrong type, other error) WHEN a resource is requested THEN the system SHALL signal a single resource-lookup failure wrapping the original cause.
    confidence: high
    confidence_basis: >
      Identical catch blocks in every method of both implementations.
    risk_class: operational
    basis: >
      Every method catches NamingException and Exception and rethrows ServiceLocatorException.
    plain_text: >
      If a needed resource cannot be found, the caller gets one uniform "lookup failed" error that carries the underlying reason.
    technical_note: >
      Both ServiceLocator classes; ServiceLocatorException wraps the cause.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 217
        line_end: 227
        excerpt: |
          public boolean getBoolean(String envName) throws ServiceLocatorException {
            Boolean bool = null;
            try {
              bool = (Boolean)ic.lookup(envName);
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
            return bool.booleanValue();
          }
    stack_metadata:
      framework: J2EE JNDI
  - record_key: ORDF-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL provide the web tier with one shared lookup instance, created once when the class loads, and the EJB tier with a lookup instance created by each caller.
    confidence: medium
    confidence_basis: >
      One clear place per tier; the unused static field in the EJB class is inferred to be vestigial.
    risk_class: operational
    basis: >
      Web version has static initializer and getInstance(); EJB version has a public constructor.
    plain_text: >
      Web pages share a single resource finder; back-end components each create their own.
    technical_note: >
      web/ServiceLocator static block creates `me`; EJB ServiceLocator declares unused `private static ServiceLocator me`.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 96
        excerpt: |
          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 62
        line_end: 74
        excerpt: |
          private InitialContext ic;

          private static ServiceLocator me;

          public ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
          }
