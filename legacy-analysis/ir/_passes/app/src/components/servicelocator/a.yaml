  - record_key: ORDF-BR-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN the web-tier lookup service WHEN a home, connection factory, queue, topic or data source is requested a second time by the same name THEN the system SHALL return the previously resolved object without a new lookup.
    confidence: high
    confidence_basis: >
      Same cache-then-lookup pattern repeated in five web-tier methods, plus a class comment stating the caching strategy. URL, boolean and string lookups are not cached.
    risk_class: operational
    basis: >
      Web tier uses a synchronized map keyed by the lookup name; the EJB tier has no cache.
    plain_text: >
      The web side remembers resources it has already found and reuses them. Settings values are looked up every time.
    technical_note: >
      web/ServiceLocator singleton with Collections.synchronizedMap cache; getUrl/getBoolean/getString bypass the cache. The cache has no eviction, so a resource rebound in the naming service is not picked up until restart. The cache key is the bare name, shared across resource types.
    interface: false
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 59
        line_end: 92
        excerpt: |
