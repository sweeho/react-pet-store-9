  - record_key: ORDER-FULFILLMENT-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL NOT cache URL, boolean and string environment entries; every call SHALL perform a fresh naming lookup, in both the web and EJB variants.
    plain_text: >
      Configuration values such as the on/off switch for confirmation mail are read fresh each time, so a changed setting is seen without a restart of the lookup.
    technical_note: >
      getUrl, getBoolean, getString bypass the cache map in web.ServiceLocator.
    interface: false
    confidence: medium
    confidence_basis: >
      Clear in code, but whether intentional is not documented.
    risk_class: operational
    basis: >
      Javadoc for getBoolean cites SEND_CONFIRMATION_MAIL env entry.
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
