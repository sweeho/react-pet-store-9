  - record_key: ORDER-FULFILLMENT-BR-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN used from the web tier, the system SHALL provide a single shared locator instance and SHALL cache EJB homes, queue/topic connection factories, queues, topics and data sources by name after first lookup, reusing the cached object on later requests.
    plain_text: >
      On the website side, a service found once is remembered and reused, so repeated requests do not search again.
    technical_note: >
      web.ServiceLocator holds a static singleton and a synchronizedMap cache keyed by JNDI name. The EJB-tier variant has no cache and is instantiated per use (public constructor).
    interface: false
    confidence: high
    confidence_basis: >
      Cache logic repeated in six getters and described in the class comment; contrasted with the uncached ejb variant.
    risk_class: operational
    basis: >
      Class javadoc states singleton and caching strategy, web tier only. Filed under closest capability.
