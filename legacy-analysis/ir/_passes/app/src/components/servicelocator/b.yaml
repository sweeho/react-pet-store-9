suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-BR-0002]
    severity: medium
    category: error-swallowed
    title: Singleton creation failure is only printed, leaving a null instance
    description: >
      If the static initialiser cannot create the locator, the error is printed to stderr and the instance stays null; getInstance() then returns null and callers fail later with a null reference.
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 96
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-BR-0003]
    severity: low
    category: other
    title: getBoolean on a missing or null entry fails with a null reference
    description: >
      getBoolean unboxes the looked-up value outside the try block; a null result throws a raw NullPointerException instead of ServiceLocatorException.
