  - record_key: ORDER-FULFILLMENT-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN any lookup fails for any reason (name not found or wrong type), WHEN the getter is called, THEN the system SHALL raise a ServiceLocatorException wrapping the original error, whose root cause can be retrieved and whose text is that of the wrapped error.
    plain_text: >
      If a needed service cannot be found, the caller receives a single kind of failure that carries the original reason.
    technical_note: >
      All getters catch NamingException and Exception and rethrow ServiceLocatorException. toString delegates to the wrapped exception; getRootCause recurses through nested ServiceLocatorExceptions.
    interface: false
    confidence: high
    confidence_basis: >
      Uniform in all getters of both classes and in the exception class.
    risk_class: operational
    basis: Exception wrapping in every getter.
    traces:
