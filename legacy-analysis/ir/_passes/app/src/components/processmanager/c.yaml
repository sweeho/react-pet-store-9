      Declared EJB-QL query plus session method calling the finder; consumers (e.g. admin pending list) not visible in this module.
    risk_class: operational
    basis: findOrdersByStatus query supports listing pending orders for admin; filed under admin-order-management as closest home.
    plain_text: Staff can list every order that currently has a given status, such as all pending orders.
