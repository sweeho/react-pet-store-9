  - record_key: ORDER-APPROVAL-WF-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL instantiate a pluggable transition handler by configured class name and pass it an XML message or batch of messages to perform a workflow transition.
    confidence: low
    confidence_basis: >
      Only the interface, factory and info holder exist in this module; no implementer or caller seen here, so reachability is unknown.
    dispute:
      reason: unresolved-reachability
      detail: >
        No TransitionDelegate implementation or caller in this module. A search of other modules for getTransitionDelegate would settle whether it is live.
    risk_class: operational
    basis: TransitionDelegate.setup/doTransition, TransitionInfo carries xml message(s), factory uses reflection.
    plain_text: Workflow steps can be plugged in by name and are handed the incoming order message to process.
    technical_note: Class.forName(className).newInstance(); any failure wrapped in TransitionException.
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 48
        line_end: 55
        excerpt: |
          public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
            TransitionDelegate td = null;
            try {
              td = (TransitionDelegate)Class.forName(className).newInstance();
            } catch(Exception e) {
              throw new TransitionException(e);
            }
    stack_metadata:
      framework: Java reflection
