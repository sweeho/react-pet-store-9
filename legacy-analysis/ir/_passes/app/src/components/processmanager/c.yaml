  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL recognise exactly five order statuses: PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED.
    confidence: medium
    confidence_basis: >
      One clear place (constants class). The entity does not enforce the set, so any string can be stored; the set is a convention.
    risk_class: operational
    basis: Status constants with comments describing each.
    plain_text: An order is either pending, approved, denied, partly shipped or completed.
    technical_note: OrderStatusNames string constants. ProcessManagerEJB/ManagerEJB accept any string without checking against these.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 50
        line_end: 65
        excerpt: |
          public static final String PENDING = "PENDING";
          public  static final String APPROVED = "APPROVED";
          public  static final String DENIED = "DENIED";
          public  static final String SHIPPED_PART = "SHIPPED_PART";
          public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
      framework: Java constants
