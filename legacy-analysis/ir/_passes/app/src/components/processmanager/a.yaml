    kind: entity
    capability_key: order-approval
    requirement: >
      The system SHALL keep exactly one workflow-status record per order, keyed by order id, holding the current order status.
    confidence: high
    confidence_basis: >
      CMP entity descriptor declares the fields and string primary key, and the entity class implements them; two places.
    risk_class: operational
    basis: Manager entity has orderId and status CMP fields, String primary key.
    plain_text: >
      Each order has one status record that tracks where the order is in processing.
    technical_note: >
      ManagerEJB is a container-managed entity (CMP 2.x) with primary key String; ejbCreate sets orderId and status.
