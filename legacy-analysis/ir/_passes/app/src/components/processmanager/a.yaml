suspected_defects:
  - capability_key: order-approval
    record_keys: [OAPP-REQ-0002, OAPP-BR-0001]
    severity: low
    category: other
    title: Status values and transitions are not validated
    description: >
      updateStatus and createManager accept any string; nothing prevents an invalid status or an illegal transition (e.g. DENIED to COMPLETED).
    traces:
