  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: The system SHALL recognise the order statuses PENDING, APPROVED, DENIED and COMPLETED, with the progressions PENDING to APPROVED to COMPLETED and PENDING to DENIED.
    confidence: high
    confidence_basis: Stated in the status constants and class comment, and in the runbook flow.
    risk_class: operational
    basis: OrderStatusNames defines the four values and the allowed transitions in its comment.
    plain_text: An order is pending, then either approved and later completed, or denied.
    technical_note: String constants only; no code in this module enforces the transitions.
    interface: false
    traces:
