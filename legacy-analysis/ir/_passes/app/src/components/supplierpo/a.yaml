  - record_key: ORDER-FULFILLMENT-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: The system SHALL, when creating a supplier purchase order, create a shipping contact record from the order's shipping information and one line item record for each line item of the incoming order, attaching all of them to the purchase order, within one transaction.
    confidence: high
    confidence_basis: Post-create logic plus descriptor transaction attribute Required.
    risk_class: operational
    basis: ejbPostCreate builds the contact and line items; failure to locate services raises CreateException.
    plain_text: When the supplier records an order, it also records the delivery contact and every ordered item as part of the same operation; if that fails the order is not created.
    technical_note: ejbPostCreate uses ServiceLocator for ContactInfo and LineItem local homes; lineItemref.create(li, 0) passes a literal 0 second argument (meaning unknown, see LineItem module). ServiceLocatorException is converted to CreateException.
    interface: false
    traces:
