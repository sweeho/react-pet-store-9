suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-ENTITY-0001]
    severity: low
    category: data-corruption
    title: getData returns shipping info from an empty new object
    description: >
      getData sets shipping info from the new SupplierOrder's own (unset) shipping info rather than the stored contact, so the returned data never carries the shipping contact; the status is also not copied.
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 215
        excerpt: |
          supplierOrder.setShippingInfo(supplierOrder.getShippingInfo());
