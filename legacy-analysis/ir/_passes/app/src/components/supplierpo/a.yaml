records:
  - record_key: ORDER-FULFILLMENT-ENTITY-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: The system SHALL persist each supplier purchase order with a purchase order id, a purchase order date (epoch time), a status, one shipping contact record and a collection of line items.
    confidence: high
    confidence_basis: Declared in the EJB class accessors and in the deployment descriptor CMP fields and relations; two places agree.
    risk_class: operational
    basis: Abstract accessors on the entity bean and descriptor cmp-fields and relationships.
    plain_text: Every order sent to the supplier is stored with its number, date, status, delivery contact and the items ordered.
    technical_note: SupplierOrderEJB is a CMP entity (abstract schema SupplierOrder) with CMP fields poId, poDate, poStatus and CMRs contactInfo (one-to-one) and lineItems (one-to-many).
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 81
        line_end: 137
        excerpt: |
          public abstract String getPoId();
          public abstract long getPoDate();
          public abstract String getPoStatus();
          public abstract ContactInfoLocal getContactInfo();
          public abstract Collection getLineItems();
