  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: The system SHALL create every new supplier purchase order with the id and date taken from the incoming order and the status PENDING.
    confidence: medium
    confidence_basis: One clear place (ejbCreate); the runbook describes the flow only at order level, not this supplier-side status.
    risk_class: operational
    basis: ejbCreate sets status to the PENDING constant regardless of input.
    plain_text: A purchase order received by the supplier starts out as pending.
    technical_note: ejbCreate copies orderId and orderDate then setPoStatus(OrderStatusNames.PENDING). Nothing in this module moves the status on to APPROVED/COMPLETED; the status vocabulary is shared with the order center.
    interface: true
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
