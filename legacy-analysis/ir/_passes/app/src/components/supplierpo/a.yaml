  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: The system SHALL delete a purchase order's shipping contact (and its address) and all of its line items when the purchase order is deleted.
    confidence: medium
    confidence_basis: Declared cascade-delete in the descriptor only; ejbRemove is empty. Runbook purge description corroborates in business terms.
    risk_class: operational
    basis: Relations mark cascade-delete on contact info and line items.
    plain_text: Removing a supplier order also removes its delivery contact and items.
    technical_note: cascade-delete in SupplierOrder-ContactInfo and SupplierOrder-LineItem relations, container-managed.
    interface: false
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/ejb-jar.xml
        line_start: 228
        line_end: 310
        excerpt: |
          <cascade-delete />
