  - record_key: CUST-REQ-0004
    kind: workflow
    capability_key: customer-account
    requirement: The system SHALL, for a customer who is not signed on and who requests a resource configured as protected, remember the requested address, show the sign-on page, and after successful sign-on redirect the customer to the remembered address.
    confidence: high
    confidence_basis: Filter logic stores the original URL and forwards to the sign-on page; validateSignOn reads it back and redirects; protected list comes from a configuration file (code + config).
    risk_class: regulated
    basis: SignOnFilter.doFilter and validateSignOn.
    plain_text: If you ask for a protected page without being signed in, you are asked to sign in and then taken to the page you wanted.
    technical_note: Servlet filter compares the request path (after context root) by exact equality with each configured url-pattern (no wildcard matching). Session attribute j_signon holds the signed-on flag; j_signon_original_url holds the target. Protected resources are read from /WEB-INF/signon-config.xml via SignOnDAO. Roles in the config are parsed but never checked by the filter.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 132
        line_end: 152
        excerpt: |
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
          ...
              if (urlPattern.equals(targetURL)) {
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  return;
              }
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 201
        line_end: 205
        excerpt: |
          hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
          // redirect to the original destination
          String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
          hres.sendRedirect(targetURL);
    stack_metadata:
      framework: Servlet filter
      session.scope: session (j_signon, j_signon_username, j_signon_original_url)
