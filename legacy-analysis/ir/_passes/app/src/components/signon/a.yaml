    requirement: The system SHALL create a new user account from a submitted user name and password and, on success, redirect the customer onward; WHEN creation fails the system SHALL redirect the customer to a user-creation error page.
    confidence: medium
    confidence_basis: The failure branch and the redirect are clearly visible; the success target URL line was partly masked in the viewed source, and duplicate-name behaviour depends on the container's primary-key handling (not read).
    risk_class: operational
