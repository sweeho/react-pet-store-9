suspected_defects:
  - capability_key: customer-account
    record_keys: [CUST-REQ-0001, CUST-REQ-0007]
    severity: high
    category: other
    title: Passwords are stored and compared in clear text
    description: >
      The stored password is compared to the submitted one with String.equals; no hashing or salting is visible in this module.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 85
        line_end: 87
  - capability_key: customer-account
    record_keys: [CUST-REQ-0003]
    severity: high
    category: other
    title: Account creation logs the submitted credentials to standard output
    description: >
      CreateUserServlet prints the user name and the password value to System.out on every sign-up attempt.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 63
        line_end: 64
  - capability_key: customer-account
    record_keys: [CUST-REQ-0004]
    severity: medium
    category: other
    title: Role constraints are read but never enforced; sign-on redirect target may be null
    description: >
      Roles from auth-constraint are parsed into each protected resource but the filter checks only the signed-on flag. A direct request to the sign-on check address with no remembered original address would redirect to a null target.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 203
        line_end: 204
  - capability_key: customer-account
    record_keys: [CUST-REQ-0005]
    severity: low
    category: error-swallowed
    title: Failure to load the sign-on configuration is only printed
    description: >
      If signon-config.xml cannot be parsed, SignOnDAO prints an error and returns null, after which the DAO dereferences it; the filter then has no protected resources.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnDAO.java
        line_start: 101
        line_end: 113
