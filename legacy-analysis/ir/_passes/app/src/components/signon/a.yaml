    technical_note: CreateUserServlet.doPost delegates to SignOnEJB.createUser -> UserLocalHome.create. Failure redirects to user_creation_error.jsp. Duplicate user names would raise a DuplicateKeyException/CreateException from the container (inferred, not read). The servlet also prints the user name and password to standard output (see suspected defects).
