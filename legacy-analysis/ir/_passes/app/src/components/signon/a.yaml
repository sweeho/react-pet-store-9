  - record_key: CUST-REQ-0006
    kind: business-rule
    capability_key: customer-account
    requirement: The system SHALL, WHEN the customer ticks the remember-user-name option at sign-on, store the user name in a cookie lasting 2678400 seconds (31 days); WHEN the option is not ticked the system SHALL expire any existing remember-user-name cookie.
    confidence: medium
    confidence_basis: One clear place; the duration is a bare literal in seconds with a comment saying "one month" (31 days by arithmetic). The cookie is set before authentication is checked.
    risk_class: operational
    basis: validateSignOn cookie handling.
    plain_text: Customers can choose to have their user name remembered for about a month; unticking the option forgets it.
    technical_note: Cookie name bp_signon, max age 2678400. Set/cleared regardless of whether authentication then succeeds.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 168
        line_end: 174
        excerpt: |
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
    stack_metadata:
      session.scope: cookie bp_signon
  - record_key: CUST-REQ-0007
    kind: entity
    capability_key: customer-account
    requirement: The system SHALL store each user account as a unique user name (the identifier) with an associated password.
    confidence: high
    confidence_basis: Declared in the deployment descriptor (primary key field, two CMP fields) and in the bean's accessors.
    risk_class: regulated
    basis: ejb-jar entity UserEJB with primkey-field userName.
    plain_text: Each account has a unique user name and a password.
    technical_note: CMP 2.x entity UserEJB, abstract schema User, primkey userName, fields userName and password. A finder findAllUsers exists. Persisted password is clear text as far as this module shows.
    interface: false
    traces:
