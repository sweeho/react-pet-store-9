records:
  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: The system SHALL authenticate a sign-on attempt by looking up the user by user name and comparing the supplied password with the stored password for exact equality, and SHALL treat an unknown user name as a failed authentication.
    confidence: high
    confidence_basis: Enforced in the session bean (lookup and FinderException handling) and the entity bean (matchPassword), plus the ejb-jar method permission; the user guide confirms sign-in with sample users.
    risk_class: regulated
    basis: authenticate() finds the user by primary key and returns matchPassword; FinderException returns false.
    plain_text: A customer can sign in only with a known user name and the exact matching password; an unknown user name is simply refused.
    technical_note: SignOnEJB.authenticate (stateless session bean) calls UserLocal.matchPassword, which does String.equals on the stored CMP password (plain text, no hashing).
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 85
        line_end: 87
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: 2.4 Creating a new user
        excerpt: |
          The sample users j2ee and shopper have the password j2ee.
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: SignOnEJB, UserEJB
      db.object: User (CMP entity, key userName)
