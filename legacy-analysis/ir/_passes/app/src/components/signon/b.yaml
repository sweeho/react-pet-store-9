      validateSignOn adds cookie bp_signon with max age 2678400 or sets max age 0 on the existing cookie.
    plain_text: >
      A visitor can ask the site to remember their user name for about a month; leaving the option off clears it.
    technical_note: >
      Cookie bp_signon, applied before authentication is checked, so it is set or cleared even when sign-on fails.
