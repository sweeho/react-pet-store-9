    record_keys: [CUST-REQ-0001, CUST-ENT-0008]
    severity: high
    category: other
    title: Passwords are stored and compared in clear text
    description: >
      The password is held as supplied and compared with String.equals; no hashing is applied anywhere in this module.
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
