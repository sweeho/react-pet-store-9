records:
  - record_key: CUST-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL authenticate a user by looking up the account whose identifier equals the submitted user name and comparing the submitted password for exact equality with the stored one; an unknown user name or a mismatched password SHALL both yield a failed sign-on.
    confidence: medium
    confidence_basis: >
      Enforced in one place (SignOnEJB.authenticate plus UserEJB.matchPassword, a single call chain); no test or document found.
    risk_class: regulated
    basis: >
      authenticate finds the user by primary key, returns false on FinderException, otherwise returns matchPassword.
    plain_text: >
      A person can sign on only with a user name that exists and the exact password stored for it.
    technical_note: >
      SignOnEJB.authenticate (stateless session bean) calls UserLocalHome.findByPrimaryKey then UserEJB.matchPassword (String.equals on a clear-text CMP field).
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: SignOnEJB, UserEJB
