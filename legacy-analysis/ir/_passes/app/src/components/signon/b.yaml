findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnDAO.java
    description: >
      The protected-resource list lives in /WEB-INF/signon-config.xml, outside this module; which pages are protected and which roles apply could not be determined. The only document found (petstore-user-guide) has no sign-on content.
