  - record_key: CUST-REQ-0003
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL treat the user name as the unique identifier of a sign-on account, so that a second account with an existing user name cannot be created.
    confidence: medium
    confidence_basis: >
      Inferred from primkey-field in the deployment descriptor; no explicit duplicate check in code and the resulting error handling was not observed.
    risk_class: operational
    basis: >
      Entity bean UserEJB uses userName as primkey-field (String key), so a duplicate create fails at the container.
    plain_text: >
      Each user name can belong to only one sign-on account.
    technical_note: >
      ejb-jar.xml primkey-field userName; duplicate creation would raise DuplicateKeyException (a CreateException subtype) which the servlet maps to the creation-error page.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/ejb-jar.xml
        line_start: 66
        line_end: 66
        excerpt: |
          <primkey-field>userName</primkey-field>
    stack_metadata:
      ejb.bean: UserEJB
      db.object: User CMP entity
  - record_key: CUST-WF-0004
    kind: workflow
    capability_key: customer-account
    requirement: >
      GIVEN a user who is not signed on WHEN the user requests a protected resource listed in the sign-on configuration THEN the system SHALL remember the requested address and show the sign-on page; GIVEN the user is signed on or the resource is not protected THEN the request SHALL proceed unchanged.
    confidence: medium
    confidence_basis: >
      Single filter implementation; the protected-resource list comes from a configuration file (signon-config.xml) that is not in this module so its contents are not seen.
    risk_class: regulated
    basis: >
      SignOnFilter.doFilter checks the session flag, then exact-matches the target path against configured url-patterns.
    plain_text: >
      Pages marked as protected ask the visitor to sign on first, then take them to the page they originally asked for.
    technical_note: >
      Servlet filter SignOnFilter; session attributes j_signon (Boolean) and j_signon_original_url; match is String.equals on the path after the context root (no wildcard matching). SignOnDAO parses /WEB-INF/signon-config.xml; auth-constraint role names are parsed but the filter never checks roles.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 124
        line_end: 155
        excerpt: |
          boolean signedOn = false;
          if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
              signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();
          } else {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));
          }
          if (signedOn) {
                  chain.doFilter(request,response);
                  return;
          }
    stack_metadata:
      framework: Servlet filter
      session.scope: HttpSession
  - record_key: CUST-WF-0005
    kind: workflow
    capability_key: customer-account
    requirement: >
      GIVEN a sign-on submission WHEN authentication succeeds THEN the system SHALL mark the session as signed on, record the user name in the session and redirect to the originally requested address; WHEN authentication fails THEN the system SHALL redirect to the configured sign-on error page and leave the session not signed on.
    confidence: medium
    confidence_basis: >
      One clear implementation in SignOnFilter.validateSignOn; no tests.
    risk_class: regulated
    basis: >
      validateSignOn sets session flags and redirects on both branches.
    plain_text: >
      After a correct sign-on the visitor lands on the page they wanted; after a wrong one they see the sign-on error page.
    technical_note: >
      Triggered when the path after the context root equals j_signon_check. If no original URL is in session, sendRedirect receives null.
