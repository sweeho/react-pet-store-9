  - record_key: CATBR-INT-0010
    kind: integration
    capability_key: catalog-browsing
    requirement: >
      The system SHALL allow callers to read the catalog either through the catalog service or directly from the database (a direct-read shortcut), with identical results, and SHALL select the database vendor-specific query set by configuration.
    confidence: medium
    confidence_basis: Helper has both code paths and the admin guide describes per-database statement sets; reachability of the direct path not traced.
    risk_class: operational
    plain_text: The catalog can be read through the service or straight from the database, and the database type is configurable.
    technical_note: >
      CatalogHelper.useFastLane toggles DAO vs EJB; CatalogDAOFactory loads the DAO class named by JNDI env-entry param/CatalogDAOClass; ejb-jar env-entry param/CatalogDAODatabase selects the statement set (values redacted in the source).
    interface: false
    basis: CatalogHelper and CatalogDAOFactory.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 300
        line_end: 302
        excerpt: |
          return useFastLane ? getItemFromDAO(itemId,locale) : getItemFromEJB(itemId,locale);
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CatalogDAOFactory.java
        line_start: 52
        line_end: 55
        excerpt: |
          InitialContext ic = new InitialContext();
          String className = (String) ic.lookup(JNDINames.CATALOG_DAO_CLASS);
          catDao = (CatalogDAO) Class.forName(className).newInstance();
      - path: legacy-analysis/sources/pdf/petstore-admin-guide/extracted.md
