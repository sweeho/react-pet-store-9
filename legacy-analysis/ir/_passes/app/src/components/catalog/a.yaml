records:
  - record_key: CATBR-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list categories ordered by name, and list the products of a category ordered by name, showing only entries that have a description in the requested locale.
    confidence: medium
    confidence_basis: >
      One clear place (the SQL statements); the user guide confirms browsing categories, products and items but not the ordering.
    risk_class: presentational
    plain_text: >
      Shoppers see the categories, and the products within a category, in alphabetical order by name, in their own language.
    technical_note: >
      CloudscapeCatalogDAO GET_CATEGORIES_STATEMENT and GET_PRODUCTS_STATEMENT join the base table to its _details table on locale and order by name.
    interface: false
    basis: SQL join to locale-specific details table with order by name.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 70
        line_end: 81
        excerpt: |
          public static String GET_CATEGORIES_STATEMENT
            = "select a.catid, name, descn "
            + " from (category a join category_details b on a.catid=b.catid) "
            + " where locale = ? order by name";
          public static String GET_PRODUCT_STATEMENT
            = "select name, descn "
            + " from (product a join product_details b on a.productid=b.productid) "
            + " where locale = ? and a.productid = ? ";
          public static String GET_PRODUCTS_STATEMENT
            = "select a.productid, name, descn "
            + " from (product a join product_details b on a.productid=b.productid) "
            + " where locale = ? and a.catid = ? order by name";
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: "2.2 Browsing and searching"
        excerpt: "Select a category to list its products, a product to list its items, and an item to see its detail."
    stack_metadata:
      framework: EJB 2.x stateless session bean with DAO
      ejb.bean: CatalogEJB
      db.object: category, category_details, product, product_details

  - record_key: CATBR-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL list the items of a product, and show the detail of a single item (category, product, name, image, description, five attributes, list price, unit cost), in the requested locale.
    confidence: medium
    confidence_basis: One clear place (SQL plus Item construction); the guide only mentions item detail and prices in general terms.
    risk_class: presentational
    plain_text: >
      Selecting a product shows its items; selecting an item shows its description, attributes and prices.
    technical_note: >
      GET_ITEM_STATEMENT / GET_ITEMS_STATEMENT join item, item_details, product_details and product on locale. Items are not ordered explicitly.
    interface: false
    basis: SQL joins and Item constructor mapping.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 82
        line_end: 95
        excerpt: |
          public static String GET_ITEM_STATEMENT
            = "select catid, a.productid, name, b.image, b.descn, attr1, "
            + "  attr2, attr3, attr4, attr5, listprice, unitcost "
            + " from (((item a join item_details b on a.itemid=b.itemid)"
            + "   join product_details c on a.productid=c.productid)"
            + "   join product d on d.productid = c.productid and b.locale = c.locale) "
            + " where b.locale = ? and a.itemid = ?";
          public static String GET_ITEMS_STATEMENT
            = "select catid, name, a.itemid, b.image, b.descn, attr1, "
            + "  attr2, attr3, attr4, attr5, listprice, unitcost "
            + " from (((item a join item_details b on a.itemid=b.itemid)"
            + "  join product_details c on a.productid=c.productid)"
            + "  join product d on d.productid=c.productid and b.locale = c.locale)"
            + " where b.locale = ? and a.productid = ?";
    stack_metadata:
      ejb.bean: CatalogEJB
      db.object: item, item_details, product_details, product

  - record_key: CATBR-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL present catalog lists in pages, and a page SHALL report whether a next page exists (more rows after the page) and whether a previous page exists (start offset greater than zero).
    confidence: high
    confidence_basis: Enforced in the DAO paging loop and in the Page model, and described in the user guide.
    risk_class: presentational
    plain_text: >
      Long lists are split into pages with Next and Previous navigation.
    technical_note: >
      DAO positions the scrollable result set at start+1 and reads up to count rows; hasNext is taken from rs.next(). Page.getStartOfPreviousPage clamps at 0.
    interface: false
    basis: Paging loop in DAO methods and Page class.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 168
        line_end: 179
        excerpt: |
          if (start >= 0 && rs.absolute(start+1)) {
            boolean hasNext = false;
            List items = new ArrayList();
            do {
              items.add(new Category(rs.getString(1).trim(),
                                     rs.getString(2),
                                     rs.getString(3)));
            } while ((hasNext = rs.next()) && (--count > 0));
            ret = new Page(items, start, hasNext);
          } else {
            ret = Page.EMPTY_PAGE;
          }
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 69
        line_end: 93
        excerpt: |
          public boolean isNextPageAvailable() {
          public boolean isPreviousPageAvailable() {
              return start > 0;
          public int getStartOfNextPage() { return start + objects.size(); }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: "2.2 Browsing and searching"
        excerpt: "Lists show 2 rows at a time with Next and Previous."
    stack_metadata:
      ejb.bean: CatalogEJB

