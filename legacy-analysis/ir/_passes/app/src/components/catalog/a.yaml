  - record_key: CATBR-REQ-0011
    kind: requirement
    capability_key: inventory-reporting
    requirement: >
      The system SHALL be checkable by a daily catalog consistency job (checks C1 to C5) for categories without products, products without items, items priced below cost, items missing a description in a served locale, and items the supplier does not stock.
    confidence: low
    confidence_basis: Seen only in the operations runbook; the check SQL (db/batch/catalog_check.sql) is not in this module so the rules were not read in code.
    risk_class: operational
    plain_text: A scheduled check reports catalog data problems such as empty categories, items priced below cost or missing descriptions.
    technical_note: Documented only; the check script lives outside this component. Filed under inventory-reporting per the capability list.
    interface: true
    basis: Document only.
    traces:
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: "3.6 PS_CATALOG_CHECK"
        excerpt: "Runs catalog checks C1 to C5 (db/batch/catalog_check.sql): category without product, product without item, item priced below cost, item missing a description in a locale the store serves, item the supplier does not stock."

suspected_defects:
  - capability_key: localization
    record_keys: [CATLOC-REQ-0009]
    severity: medium
    category: other
    title: Locale string parser ignores variants and returns null for strings without an underscore
    description: >
      getLocaleFromString never assigns variantIndex (it modifies countryIndex instead), so a variant is never parsed; a string with no underscore returns null, and the DAO then dereferences the locale (l.toString()), which would fail with a null pointer rather than a handled error.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 365
        line_end: 380
        excerpt: |
          if (localeString == null) return null;
          if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
          int languageIndex = localeString.indexOf('_');
          if (languageIndex  == -1) return null;
