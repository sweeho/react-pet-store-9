  - capability_key: catalog-browsing
    record_keys: [CATBR-REQ-0001, CATBR-REQ-0003]
    severity: low
    category: error-swallowed
    title: Database errors in catalog reads are rewrapped as generic system exceptions; connections leak on error
    description: >
      Connections, statements and result sets are closed only on the success path; on SQLException they are not closed, so repeated failures can exhaust the pool.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 181
        line_end: 188
        excerpt: |
          rs.close();
          ps.close();
          c.close();
          return ret;
        } catch (SQLException se) {
          se.printStackTrace(System.err);
          throw new CatalogDAOSysException("SQLException: " + se.getMessage());

