  - record_key: CATBR-REQ-0005
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL search items by one or more whitespace-separated keywords, case-insensitively, returning every item in the requested locale whose product name, category identifier or item description contains ANY of the keywords as a substring.
    confidence: high
    confidence_basis: Dynamic SQL in the DAO plus the user guide describing the same behaviour; the guide says "category" while code matches the category id.
    risk_class: operational
    plain_text: >
      Typing one or more words in the search box shows items that match any of the words, ignoring upper/lower case, in the product name, category or item description.
    technical_note: >
      CloudscapeCatalogDAO.searchItems tokenises with StringTokenizer into a HashSet (duplicates collapse), builds lower(...) like '%kw%' predicates for name, catid and b.descn, ORed. Keywords are bound as parameters. Result is paged like other lists.
    interface: false
    basis: searchItems and SEARCH_ITEMS_STATEMENT_FRAGMENTS.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 103
        line_end: 109
        excerpt: |
          "    and ((lower(name) like ? ",
          "          or lower(name) like ? ",
          "    ) or (lower(catid) like ? ",
          "          or lower(catid) like ? ",
          "    ) or (lower(b.descn) like ? ",
          "          or lower(b.descn) like ? ",
          ") )"
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 347
        line_end: 354
        excerpt: |
          Collection keywords = new HashSet();
          StringTokenizer st = new StringTokenizer(searchQuery);
          while (st.hasMoreTokens()) {
            keywords.add(st.nextToken());
          }
          if (keywords.isEmpty()) {
            return Page.EMPTY_PAGE;
          }
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: "2.2 Browsing and searching"
        excerpt: "Search is not case-sensitive. It matches the product name, the category and the item description, and shows items that match any of the words."
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required
      db.object: item, item_details, product_details, product

