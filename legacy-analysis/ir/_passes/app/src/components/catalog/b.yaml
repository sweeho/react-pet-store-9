    confidence: high
    confidence_basis: Same behaviour in Generic and Cloudscape DAOs (rs.first() else null).
    risk_class: operational
    basis: getCategory/getProduct/getItem return null when result set is empty; item detail includes image, description, five attributes, list price and unit cost.
    plain_text: Looking up a single category, product or item shows its name, description and (for items) image, attributes, list price and unit cost; an unknown identifier gives nothing.
    technical_note: GenericCatalogDAO.getItem maps 13 columns into Item; null returned, not exception, for missing id.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 266
        line_end: 294
        excerpt: |
          if (resultSet.first()) {
            int i = 1;
            return new Item(resultSet.getString(i++).trim(),
          ...
          return null;
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required
  - record_key: CATB-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL return list results as pages defined by a start offset and a count, and each page SHALL indicate whether a next page and a previous page exist.
    confidence: high
    confidence_basis: Paging logic repeated in four DAO methods and in the Page model.
    risk_class: operational
    basis: DAO positions at start+1 and reads up to count rows; hasNext set from remaining rows; previous available when start > 0.
    plain_text: Long lists are shown a page at a time, with next and previous navigation only when there are more entries.
    technical_note: Page.isNextPageAvailable returns hasNext; isPreviousPageAvailable is start>0; default count in CatalogHelper is 2.
    interface: false
    traces:
