  - record_key: CATB-REQ-0005
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL search items by free-text query split on whitespace into distinct keywords, matching an item when any keyword is contained in the product name, the category identifier or the item description, in the requested locale.
    confidence: high
    confidence_basis: Logic in both Generic DAO (with SQL XML) and Cloudscape DAO; keywords OR-ed per SQL fragments.
    risk_class: operational
    basis: Keywords collected in a HashSet; each yields three LIKE %kw% conditions OR-ed.
    plain_text: Shoppers can search by typing words; an item is found if any word appears in its product name, category or description.
    technical_note: Search is a substring LIKE on lower(name), lower(catid), lower(b.descn). Keyword order is HashSet order, irrelevant to result.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 365
        excerpt: |
          StringTokenizer tokenizer = new StringTokenizer(searchQuery);
          while (tokenizer.hasMoreTokens()) { keywordSet.add(tokenizer.nextToken()); }
          ...
          parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |
          where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
    stack_metadata:
      framework: DAO
  - record_key: CATB-BR-0006
    kind: business-rule
    capability_key: catalog-browsing
    requirement: GIVEN a search query that is empty or only whitespace WHEN a search is made THEN the system SHALL return an empty page without querying the database.
    confidence: high
    confidence_basis: Explicit early return in both DAO implementations.
    risk_class: presentational
    basis: keywordSet.isEmpty() returns Page.EMPTY_PAGE.
    plain_text: A blank search shows no results.
    technical_note: Guard precedes getConnection.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 350
        line_end: 352
        excerpt: |
          if (keywordSet.isEmpty()) {
            return Page.EMPTY_PAGE;
          }
    stack_metadata:
      framework: DAO
  - record_key: CATB-REQ-0007
    kind: requirement
    capability_key: localization
    requirement: The system SHALL serve all catalog names and descriptions in the locale supplied by the caller, using locale-specific detail rows keyed by the locale string.
    confidence: high
    confidence_basis: Every SQL statement filters on locale = ?, and the locale parameter is always the first value.
    risk_class: presentational
    basis: parameterValues[0] = locale.toString() in each DAO method; *_details tables carry locale.
    plain_text: Catalog text appears in the shopper's chosen language.
    technical_note: Filed under localization as closest fit; also relevant to catalog-browsing. A null locale causes NullPointerException (no default).
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 165
        line_end: 165
        excerpt: |
          String[] parameterValues = new String[] { locale.toString(), categoryID };
    stack_metadata:
      db.object: category_details, product_details, item_details
  - record_key: CATB-REQ-0008
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL support a direct-to-database access mode and an EJB access mode for catalog queries, selected per helper instance, both returning identical results.
    confidence: medium
    confidence_basis: Visible in one class (CatalogHelper); the configuration choosing the mode is outside this module.
    risk_class: operational
    basis: useFastLane true uses DAO directly; false goes through the CatalogEJB local interface; default constructor selects fast lane.
    plain_text: Catalog data is read either directly or through the application server's business layer; the shopper sees no difference.
    technical_note: CatalogHelper.*FromDAO vs *FromEJB; EJB methods all trans-attribute Required, stateless.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 85
        line_end: 91
        excerpt: |
          public CatalogHelper(boolean useFastLane) { this.useFastLane = useFastLane; }
          public CatalogHelper() { useFastLane = true; }
      - path: legacy-source/app/src/components/catalog/src/ejb-jar.xml
        line_start: 91
        line_end: 102
        excerpt: |
          <container-transaction> ... <trans-attribute>Required</trans-attribute>
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required
  - record_key: CATB-REQ-0009
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL support database-specific SQL for Cloudscape and Oracle selected by configuration, and SHALL load the DAO implementation class named in configuration.
    confidence: medium
    confidence_basis: Seen in factory and SQL XML; deployed values not in this module.
    risk_class: operational
    basis: DAO class and SQL file URL and database type come from JNDI environment entries.
    plain_text: The catalog can run against different database products.
    technical_note: CatalogDAOFactory.getDAO via JNDINames.CATALOG_DAO_CLASS; GenericCatalogDAO loads DAOStatements for matching database attribute.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CatalogDAOFactory.java
        line_start: 57
        line_end: 59
        excerpt: |
          InitialContext ic = new InitialContext();
          String className = (String) ic.lookup(JNDINames.CATALOG_DAO_CLASS);
          catDao = (CatalogDAO) Class.forName(className).newInstance();
    stack_metadata:
      framework: DAO factory
      db.object: CatalogDAOSQL.xml
  - record_key: CATB-REQ-0010
    kind: requirement
    capability_key: catalog-browsing
    requirement: GIVEN a data-access failure WHEN catalog data is requested THEN the system SHALL raise a catalog error carrying the underlying message to the caller.
    confidence: medium
    confidence_basis: Consistent wrapping pattern, but message handling not tested.
    risk_class: operational
    basis: SQLException wrapped as CatalogDAOSysException, then EJBException or CatalogException.
    plain_text: If the catalog cannot be read, the caller receives an error rather than partial data.
    technical_note: See CatalogEJB and CatalogHelper catch blocks.
    interface: false
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 177
        line_end: 186
        excerpt: |
          } catch (CatalogDAOSysException se) {
              throw new CatalogException(se.getMessage());
          }
    stack_metadata:
      ejb.bean: CatalogEJB
suspected_defects:
  - capability_key: catalog-browsing
    record_keys: [CATB-REQ-0005]
    severity: medium
    category: inconsistent-rounding
    title: Generic DAO search does not lower-case keywords although SQL lower-cases columns
    description: >
      The Cloudscape DAO lower-cases each keyword before matching; the generic DAO passes the keyword unchanged against lower(column), so a search containing capital letters returns nothing on that path.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 361
        line_end: 364
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
        line_start: 380
        line_end: 390
  - capability_key: localization
    record_keys: [CATB-REQ-0007]
    severity: low
    category: unreachable-branch
    title: Locale parser never builds a variant
    description: >
      getLocaleFromString sets variantIndex to -1 and never assigns it afterwards, so the variant branch cannot run; when a locale has a second underscore the country keeps the trailing text. A malformed or missing underscore yields a null locale which later fails.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 359
        line_end: 386
  - capability_key: catalog-browsing
    record_keys: [CATB-REQ-0003]
    severity: low
    category: other
    title: Page request count of zero or less still returns one row
    description: >
      The do/while loop adds a row before testing count, so a count of 0 or negative returns one row.
    traces:
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 251
        line_end: 255
findings: []
