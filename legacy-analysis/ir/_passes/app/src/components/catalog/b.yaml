records:
  - record_key: CATB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL list catalog categories, products within a category, and items within a product, each in the requested locale and ordered by name (items in unspecified order).
    confidence: high
    confidence_basis: Hierarchy and ordering visible in the SQL statements and the DAO methods, and duplicated in the Cloudscape DAO; no tests or docs read.
    risk_class: operational
    basis: SQL for GET_CATEGORIES/GET_PRODUCTS filters on locale and orders by name; GET_ITEMS has no ORDER BY.
    plain_text: Shoppers can see a list of categories, the products in a category and the items of a product, in their language. Categories and products are sorted alphabetically.
    technical_note: GenericCatalogDAO.getCategories/getProducts/getItems build SQL from CatalogDAOSQL.xml; CloudscapeCatalogDAO has hardcoded equivalents.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 111
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
          ... where locale = ?  order by name
          <SQLStatement method="GET_PRODUCTS"> ... where locale = ? and a.catid = ? order by name
          <SQLStatement method="GET_ITEMS"> ... where b.locale = ? and a.productid = ?
    stack_metadata:
      framework: EJB 2 / DAO
      db.object: category, category_details, product, product_details, item, item_details
