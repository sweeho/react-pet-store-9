  - record_key: ORDF-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL store, with each purchase order, one contact record, one credit card record and one or more line items, created from the submitted order when the order is created, and SHALL delete them when the order is deleted.
    confidence: high
    confidence_basis: >
      Relationships with cascade-delete are declared in ejb-jar.xml and creation of the dependents is coded in ejbPostCreate.
    risk_class: operational
    basis: ejb-relation PurchaseOrder-ContactInfo/Card/LineItem; ejbPostCreate creates each and links it. DTD requires LineItem+.
    plain_text: >
      An order always keeps its customer contact details, payment card and the items ordered, and these are removed together with the order.
    technical_note: >
      ejbPostCreate creates ContactInfo from getShippingInfo(), CreditCard, and LineItems (quantity-shipped arg 0). Any ServiceLocatorException becomes CreateException, aborting creation.
    interface: false
