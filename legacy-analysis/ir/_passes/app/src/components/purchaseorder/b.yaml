      Declared in ejb-jar.xml cmp-fields and in the bean's abstract accessors and ejbCreate; also confirmed by the runbook's extract column list.
    risk_class: financial
    basis: CMP fields poId, poUserId, poEmailId, poDate, poLocale, poValue with poId as primary key.
    plain_text: >
      Every purchase order is stored with its number, the customer, the customer's email, the order time, the language/region and the order total.
    technical_note: >
      PurchaseOrderEJB CMP 2.x entity; poValue is a float; poDate stored as epoch millis (long); locale stored as string.
