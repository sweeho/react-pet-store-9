        line_start: 157
        line_end: 190
        excerpt: |
          pohome.findPOBetweenDates(start.getTime(), end.getTime());
          if(request.equals("REVENUE")) {
          chartDetails.put(id, new Float(tmpValue.floatValue() + (loc.getQuantity()*loc.getUnitPrice())));
    stack_metadata:
