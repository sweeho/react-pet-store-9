          Collection orders = mgr.getOrdersByStatus(status);
          po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
          String podate = (gotDate.getMonth()+1) + "/" + gotDate.getDate() + "/" + (gotDate.getYear()+1900);
          retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(), podate, po.getPoValue(), status));
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
