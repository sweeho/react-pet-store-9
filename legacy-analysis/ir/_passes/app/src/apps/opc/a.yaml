suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDAPP-RULE-0001]
    severity: medium
    category: other
    title: Orders in locales other than US or Japan are never auto-approved
    description: >
      Auto-approval has branches only for US and Japan locales; a Chinese (zh_CN) order, for which templates exist, always waits for an admin regardless of value. Documents mention only a "less than $500" rule. Thresholds also ignore currency.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1
  - capability_key: order-approval
    record_keys: [ORDAPP-RULE-0001]
    severity: low
    category: contradicts-document
    title: Boundary at exactly 500 differs from wording
    description: >
      User guide says pending when value is "greater than $500" while code leaves exactly 500 pending too (auto-approve only when strictly less).
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 186
        line_end: 186
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1
  - capability_key: localization
    record_keys: [LOC-RULE-0001]
    severity: low
    category: unreachable-branch
    title: Locale parser variant handling is dead
    description: >
      variantIndex is never assigned, so the variant branch can never run and a three-part locale string yields a wrong country.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 52
        line_end: 66
  - capability_key: order-notifications
    record_keys: [ORDNOT-RULE-0002]
    severity: medium
    category: error-swallowed
    title: Mail failure rolls back and redelivers the whole message
    description: >
      Any formatter, XML or lookup failure is rethrown as EJBException; one order lacking a stylesheet for its locale prevents mails for every order in the same batch message.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailOrderApprovalMDB.java
        line_start: 130
        line_end: 143
findings:
