suspected_defects:
  - capability_key: order-approval
    record_keys: [ORDAPP-RULE-0001]
    severity: medium
    category: contradicts-document
    title: Auto-approval boundary differs between user guide and code
    description: >
      The user guide says an order is pending if its total is greater than 500, so exactly 500 would be approved; the code approves only when strictly below 500.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 186
        line_end: 186
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: p1 - 3.3 Approving or denying orders
  - capability_key: admin-order-management
    record_keys: [ADMIN-REQ-0002]
    severity: low
    category: inconsistent-rounding
    title: Revenue totalled in single-precision float
    description: Revenue is summed as Float, which can lose precision for large totals.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 198
        line_end: 203
  - capability_key: localization
    record_keys: [LOCAL-RULE-0001]
    severity: low
    category: unreachable-branch
    title: Locale variant parsing never executes
    description: variantIndex stays -1, so the variant branch is unreachable.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 62
        line_end: 68
findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb-jar.xml
    description: >
      Env-entry values (mail switches, validation flags) are redacted in the source; defaults for notification switches cannot be read.
