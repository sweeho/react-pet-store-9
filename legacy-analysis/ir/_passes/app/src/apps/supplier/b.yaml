  - record_key: customer-account-BR-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL require sign-on with the administrator role to use the supplier inventory update function.
    confidence: medium
    confidence_basis: One declarative place (web.xml); only the request processor URL is constrained, so JSPs may be reachable directly. Filed under customer-account as the closest listed role-security capability.
