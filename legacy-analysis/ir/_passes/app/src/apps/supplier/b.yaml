suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [order-fulfillment-BR-0002]
    severity: medium
    category: other
    title: Order marked COMPLETED when a pass ships nothing and no line was blocked
    description: >
      allItemsAvailable starts true and only turns false on a stock failure, so lines skipped as already shipped never block completion; an order whose invoice generation fails is still set COMPLETED and returns no invoice (error printed, invoice lost).
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 439
        line_end: 450
        excerpt: |
          if(allItemsAvailable)
            po.setPoStatus(OrderStatusNames.COMPLETED);
  - capability_key: order-fulfillment
    record_keys: [order-fulfillment-WORKFLOW-0002, order-fulfillment-REQ-0002]
    severity: high
    category: error-swallowed
    title: Inventory update failures are printed and swallowed, leaving the screen unanswered and the transaction open
    description: >
      All exceptions in the update-inventory path are only printStackTrace'd; no forward or rollback occurs, so a failure yields no user response, and invoice sending errors are swallowed while the transaction still commits (invoices lost, order stays APPROVED upstream, see runbook 4.3).
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 190
        line_end: 206
        excerpt: |
          fe.printStackTrace();
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        excerpt: |
          An order stays APPROVED when the supplier's invoice message never reaches the OPC
        anchor: p1 (4.3 Stuck APPROVED order)
