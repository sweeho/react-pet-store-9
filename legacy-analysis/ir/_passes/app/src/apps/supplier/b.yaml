  - record_key: order-fulfillment-WORKFLOW-0002
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order that could not be fully shipped on arrival WHEN the supplier's stock is updated THEN the system SHALL reprocess every supplier order with status PENDING, ship what stock now allows, and send an invoice for each order that shipped something.
    confidence: high
    confidence_basis: Code (processPendingPO and servlet call) plus user guide and runbook describing the behaviour.
    risk_class: operational
    basis: updateinventory screen action runs updateInventory then processPendingPO then sends invoices in one user transaction.
    plain_text: >
      After a stock clerk updates stock, waiting orders are retried and invoices go out for anything that can now ship.
    technical_note: >
      RcvrRequestProcessor.doPost (currentScreen=updateinventory) with UserTransaction begin/commit; facade.findOrdersByStatus(PENDING). The transaction is committed only on the success path; exceptions are only printed.
    interface: true
