  - record_key: order-fulfillment-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL ship a purchase order line only when current stock for the item is at least the line quantity, and on shipping SHALL reduce stock by that quantity; a line with insufficient stock or an unknown item SHALL be left unshipped.
    confidence: medium
    confidence_basis: One clear enforcement place (checkInventory); no schema constraint or test. Behaviour on unknown item (not found) read from the catch returning false.
    risk_class: operational
    basis: All-or-nothing per line; no partial shipment of a line.
    plain_text: >
      A line is shipped in full only if the supplier has enough stock of that item; otherwise it waits. Stock goes down by the shipped amount.
    technical_note: >
      OrderFulfillmentFacadeEJB.checkInventory: findByPrimaryKey(itemId), compare getQuantity to line quantity, reduceQuantity. FinderException returns false.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 368
        line_end: 381
        excerpt: |
          if(inv.getQuantity() < item.getQuantity())
            return(false);
          inv.reduceQuantity(item.getQuantity());
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      db.object: Inventory CMP entity
  - record_key: order-fulfillment-BR-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL skip lines already fully shipped, mark each newly shipped line fully shipped, and mark the supplier order COMPLETED only when every line was available in this pass.
    confidence: medium
    confidence_basis: One clear place; completion flag derived from allItemsAvailable, which stays true if lines were skipped as already shipped.
    risk_class: operational
    basis: processAnOrder loops lines, tracks allItemsAvailable and invoiceReqd.
    plain_text: >
      Already shipped lines are not shipped twice. The order is complete once nothing is left waiting for stock.
    technical_note: processAnOrder in OrderFulfillmentFacadeEJB.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 429
        line_end: 440
        excerpt: |
          if(li.getQuantity() == li.getQuantityShipped())
            continue;
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
  - record_key: order-fulfillment-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL, when at least one line is shipped in a pass, produce one invoice XML document listing only the lines shipped in that pass, with shipping date set to the processing time, the original order date, and a fixed customer label, and SHALL send it to the invoice topic for the order center.
    confidence: high
    confidence_basis: Invoice creation, topic sending and the document flow description agree across code (facade, delegate) and the runbook.
    risk_class: financial
    basis: createInvoice adds only lines in the shipped map; SupplierOrderTD publishes to the invoice topic.
    plain_text: >
      Each time goods ship, the supplier sends the order center an invoice for exactly the items shipped in that run. The invoice addresses the customer generically.
    technical_note: >
      createInvoice sets userId to the literal "Dear PetStore Customer"; SupplierOrderTD.doTransition publishes via TopicSender to the invoice MDB topic.
    interface: true
