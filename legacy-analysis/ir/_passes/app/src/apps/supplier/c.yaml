records:
  - record_key: ORDER-FULFILLMENT-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL accept each supplier purchase order from the order center's purchase-order queue, persist it, attempt to fulfil it from inventory, and, when at least one line was shipped, send an invoice back to the order center; when nothing was shipped it SHALL send no invoice.
    plain_text: >
      When the order center sends the supplier an order, the supplier records it, ships what it has in stock, and sends the order center an invoice for what was shipped. If nothing could be shipped, no invoice goes out.
    technical_note: >
      SupplierOrderMDB.onMessage reads the TextMessage, calls OrderFulfillmentFacade.processPO, and calls the transition delegate only if the returned invoice is non-null. Failures are rethrown as EJBException.
    interface: true
    confidence: high
    confidence_basis: >
      Code in the message bean and facade agrees, and the operations runbook flow diagram states the same path.
    risk_class: financial
    basis: Message bean and facade code.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 113
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();

              // Do processing work on received message
              String invoice = doWork(recdText);

              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              } //else wait for the inventory to arrive at the inventory receiver
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
