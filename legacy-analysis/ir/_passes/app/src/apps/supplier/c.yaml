  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order line for an item with no inventory record, WHEN fulfilment is attempted, THEN the system SHALL treat the line as not available and leave it unshipped, without raising an error.
    plain_text: >
      An item the supplier has never stocked is simply not shipped; the order stays open.
    technical_note: >
      FinderException from invHome.findByPrimaryKey is swallowed in checkInventory (comment: supplier has not been populated).
