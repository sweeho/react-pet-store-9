  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0008
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL accept an entered inventory quantity only when it is a non-negative integer, and SHALL ignore negative values and empty entries.
    plain_text: >
      Stock levels can be set to zero or more. Blank entries are skipped and negative numbers are ignored.
    technical_note: >
      updateInventory: skips null/empty qty; applies setQuantity only if qty >= 0. Non-numeric input throws NumberFormatException, which is not caught there.
