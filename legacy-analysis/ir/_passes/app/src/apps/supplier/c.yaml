  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL set a purchase order's status to COMPLETED only when every line could be fulfilled in the current attempt; otherwise the order SHALL keep its prior status (pending) so it can be retried when inventory arrives.
    plain_text: >
      An order is marked completed only once all its lines have stock. Otherwise it waits and is retried later.
    technical_note: >
      allItemsAvailable is set false when any unshipped line fails checkInventory; po.setPoStatus(COMPLETED) is applied only if still true. Pending orders are found via findOrdersByStatus(PENDING).
    interface: false
    confidence: high
    confidence_basis: Code plus the user guide and runbook describing re-evaluation of unfulfilled orders.
    risk_class: financial
    basis: processAnOrder and processPendingPO.
    traces:
