suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-WORKFLOW-0007]
    severity: high
    category: error-swallowed
    title: Inventory update errors are printed and the clerk gets no response
    description: >
      Every exception in the update transaction (including rollback) is only printed to the server log; no forward or error page is produced and the clerk sees no result. Invoice send failures are also swallowed inside sendInvoices, so the transaction can commit although invoices were never sent, leaving orders stuck (the runbook describes this stuck state).
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 152
        line_end: 156
        excerpt: |
          } catch(ServiceLocatorException se) {
            se.printStackTrace();
          } catch(TransitionException te) {
            te.printStackTrace();
          }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1
        excerpt: |
          An order stays APPROVED when the supplier's invoice message never reaches the OPC
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-BUSINESS-RULE-0004]
    severity: medium
    category: error-swallowed
    title: Invoice build failure leaves stock deducted and lines marked shipped
    description: >
      If invoice generation fails after lines were marked shipped and inventory reduced, the facade prints the error and returns null; no invoice is sent although stock was consumed and quantityShipped set, and the order may be marked COMPLETED. A later retry skips these lines, so the invoice is never produced.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 199
        line_end: 207
        excerpt: |
          if(invoiceReqd) {
            try {
              invoiceXml = (createInvoice(po, items));
            } catch (XMLDocumentException xe) {
              //so order wont be fullfilled but po is persisted
              //and can be fullfilled later.
              System.out.println("OrderFulfillmentFacade**" + xe);
              return null;
            }
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-BUSINESS-RULE-0009]
    severity: low
    category: other
    title: Servlet shared flag for GET/POST dispatch is not thread-safe
    description: >
      RcvrRequestProcessor stores fromDoGet as an instance field, so concurrent requests can interfere with each other's routing. Also the servlet comment names the user "supplier" while the security constraint requires role administrator.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 159
        line_end: 164
        excerpt: |
          public void doGet(HttpServletRequest req, HttpServletResponse resp)
            throws java.io.IOException, javax.servlet.ServletException {
              fromDoGet = true;
              doPost(req, resp);
              fromDoGet = false;
          }
