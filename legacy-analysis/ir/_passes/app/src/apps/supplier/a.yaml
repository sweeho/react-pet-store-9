  - record_key: ORD-FUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL, after the invoice is produced, forward each invoice to the order center; GIVEN no invoice was produced WHEN a purchase order is received THEN nothing SHALL be forwarded and the order SHALL wait for a later stock update.
    confidence: high
    confidence_basis: MDB code and comment, plus runbook (invoice via InvoiceTopic to OPC; stuck APPROVED order when invoice message is lost).
    risk_class: operational
    basis: onMessage only calls the transition when an invoice string is returned.
    plain_text: >
      Invoices go back to the order center when goods ship. If nothing shipped, the order just waits until stock arrives.
    technical_note: SupplierOrderMDB.onMessage -> TransitionDelegate (class name from env entry). Any exception becomes EJBException, so the message is rolled back.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
              try {
                String messageID = recvMsg.getJMSMessageID();
                TextMessage recdTM = (TextMessage)recvMsg;
                String recdText = recdTM.getText();
          
                // Do processing work on received message
                String invoice = doWork(recdText);
          
                // If orders were shipped, do the transition
                if(invoice!=null) {
                  doTransition(invoice);
                } //else wait for the inventory to arrive at the inventory receiver
              } catch (TransitionException te) {
                  throw new EJBException(te);
              } catch  (CreateException ce) {
                throw new EJBException(ce);
              } catch  (XMLDocumentException xe) {
                throw new EJBException(xe);
              } catch  (JMSException je) {
                throw new EJBException(je);
              }
            }
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: "section 4.3 Stuck APPROVED order"
