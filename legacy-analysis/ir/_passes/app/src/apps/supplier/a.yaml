suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORD-FUL-BR-0003, ORD-FUL-BR-0001]
    severity: high
    category: error-swallowed
    title: Invoice generation failure leaves stock deducted and lines marked shipped with no invoice
    description: >
      Stock is deducted and lines marked shipped before the invoice is built. If invoice creation fails, the error is only printed and null is returned; later passes skip already-shipped lines, so the invoice is never produced and the order may be COMPLETED without ever reaching the order center.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 186
        line_end: 207
  - capability_key: order-fulfillment
    record_keys: [ORD-FUL-WF-0002]
    severity: medium
    category: error-swallowed
    title: Inventory update servlet swallows exceptions and shows no result
    description: >
      Failures during update, invoice sending or commit are only printed; the user gets no forward or error page, and part of the work may be lost.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 190
        line_end: 206
