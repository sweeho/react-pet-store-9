    capability_key: order-fulfillment
    requirement: >
      GIVEN a purchase order line whose item has no inventory record WHEN fulfilment is attempted THEN the system SHALL treat the line as unavailable, leave it unshipped and leave the order open.
    confidence: medium
    confidence_basis: One clear place (finder exception handled as unavailable) with an explanatory comment.
    risk_class: operational
    basis: The comment states the supplier has not been populated, so that part cannot be fulfilled now.
    plain_text: >
      If the supplier does not stock an item at all, that line is not shipped and the order stays open.
    technical_note: checkInventory catches FinderException and returns false.
