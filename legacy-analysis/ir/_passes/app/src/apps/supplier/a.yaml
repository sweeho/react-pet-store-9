  - record_key: ORD-FUL-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL ship a purchase order line only when the stock held for its item is at least the line quantity, SHALL deduct the line quantity from stock on shipping, and SHALL mark the line fully shipped; lines already fully shipped SHALL be skipped.
    confidence: high
    confidence_basis: >
      Enforced in the facade check and the inventory entity reduce operation, plus the user guide describes completion of lines.
    risk_class: financial
    basis: Whole-line shipping, no partial shipment of a line; stock never goes below zero through this path.
    plain_text: >
      A line is shipped only if there is enough stock for the whole quantity; otherwise it waits. Shipping reduces stock by that quantity.
    technical_note: >
      checkInventory compares and calls reduceQuantity; processAnOrder skips lines where quantity == quantityShipped and sets quantityShipped = quantity.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
              try {
                InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
                if(inv.getQuantity() < item.getQuantity())
                  return(false);
                inv.reduceQuantity(item.getQuantity());
              } catch (FinderException fe) {
                // swallow the finder exception because this means
                // supplier has not been populated; So we cant fulfill
                // this part of the order now
                return(false);
              }
              return(true);
            }
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 186
        line_end: 195
        excerpt: |
          LineItemLocal li = (LineItemLocal) liIt.next();
                  if(li.getQuantity() == li.getQuantityShipped())
                    continue;
