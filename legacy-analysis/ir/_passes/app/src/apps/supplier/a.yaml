records:
  - record_key: ORD-FUL-REQ-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL accept each purchase order message arriving on the supplier purchase-order queue, persist it as a supplier order, and attempt to fulfil it immediately from inventory.
    confidence: high
    confidence_basis: >
      MDB onMessage and facade processPO show the flow, and the operations runbook flow diagram (APPROVED --> Supplier --> ships from INVENTORY) corroborates it.
    risk_class: operational
    basis: Message-driven bean delegates to the order fulfilment facade, which stores the order then runs fulfilment.
    plain_text: >
      When an approved order is sent to the supplier, the supplier records it and tries to ship it straight away from stock.
    technical_note: >
      SupplierOrderMDB.onMessage -> OrderFulfillmentFacadeEJB.processPO (XML to SupplierOrder, create entity, processAnOrder). Container transactions.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 236
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
                XMLDocumentException {
              String invoiceXml = null;
              SupplierOrderLocal order = null;
          
              // Convert Po in XML to PO as Java Obj
              SupplierOrder supplierOrder = null;
              supplierOrderXDE.setDocument(poXmlDoc);
              supplierOrder = supplierOrderXDE.getSupplierOrder();
              //persist order
              order = supplierOrderLocalHome.create(supplierOrder);
              //fullfil order
              invoiceXml = processAnOrder(order);
              return invoiceXml;
