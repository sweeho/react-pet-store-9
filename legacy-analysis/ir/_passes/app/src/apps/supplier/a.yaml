    stack_metadata:
      ejb.bean: SupplierOrderMDB
      ejb.transaction: Required
      jms.queue: jms/opc/InvoiceTopic
  - record_key: ORD-FUL-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL let a stock clerk set the quantity of any inventory item to a new value of zero or more; blank or negative entries SHALL be ignored.
    confidence: medium
    confidence_basis: One clear place in the servlet; the user guide describes the screen but not the negative-value rule.
    risk_class: operational
    basis: Parameters item_<id> select the item and qty_<id> carries the value; only values >= 0 are written.
    plain_text: >
      The stock clerk can overwrite the stock count of each item with a new count; empty or negative entries are ignored without a message.
    technical_note: RcvrRequestProcessor.updateInventory; non-numeric input would throw NumberFormatException (not handled).
    interface: false
    traces:
