  - record_key: ORD-FUL-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL mark a supplier order COMPLETED only when every one of its lines is available and shipped, and SHALL issue an invoice listing only the lines shipped in the current attempt; if no line shipped, no invoice SHALL be produced.
    confidence: high
    confidence_basis: Status and invoice logic in one method, corroborated by the user guide status table (COMPLETED = all lines shipped and invoiced).
    risk_class: financial
    basis: allItemsAvailable gates status; invoiceReqd gates invoice; createInvoice filters by shipped-items map.
    plain_text: >
      An order is complete only when everything has shipped. Each shipment gets an invoice covering just the items shipped in that run; nothing shipped means no invoice.
    technical_note: >
      processAnOrder / createInvoice. Invoice customer name is the literal "Dear PetStore Customer"; shipping date is the current date.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 183
        line_end: 208
        excerpt: |
          Collection liColl = po.getLineItems();
