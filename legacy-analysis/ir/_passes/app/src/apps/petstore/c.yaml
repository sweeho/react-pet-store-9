# Pass C (tie-breaker) for app/src/apps/petstore. P = legacy-source/app/src/apps/petstore/src
records:
  - record_key: ORDER-CHECKOUT-REQ-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: >
      The system SHALL reject an order submission when any of last name, first name, street address,
      city, state or province, postal code or telephone number is blank in either the billing or the
      shipping block, and SHALL list the missing fields back to the customer; second street line and
      e-mail are optional.
    confidence: high
    confidence_basis: >
      The same field checks appear in two actions (order and customer) and the screens set matching maxlength
      values, so enforced in more than one place. The mapping of the "missing" error to a screen was not seen
      in this module (MissingFormDataException is stored as a request attribute only).
    risk_class: operational
    basis: >
      OrderHTMLAction.extractContactInfo trims each parameter, collects blank required ones into
      missingFields and, if any, stores a MissingFormDataException on the request and returns null (no order event).
    plain_text: >
      A customer cannot place an order unless every required billing and shipping detail is filled in.
    technical_note: >
      OrderHTMLAction.extractContactInfo is called twice with suffixes _a and _b. Returning null suppresses the
      EJB event so the order is not sent. address_2 blank is converted to null; email may be absent.
    interface: false
    stack_metadata:
      framework: Java Pet Store WAF front controller
      struts.action: order.do -> OrderHTMLAction
      jsp.page: enter_order_information.jsp
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 105
        line_end: 110
        excerpt: |
          String address1 = request.getParameter("address_1" +suffix).trim();
          if (address1.equals("")){
              if (missingFields == null) {
                  missingFields = new ArrayList();
              }
              missingFields.add("Street Address");
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 150
        line_end: 154
        excerpt: |
          if (missingFields != null) {
              MissingFormDataException ex = new MissingFormDataException("Missing Address Data", missingFields);
              request.setAttribute(PetstoreKeys.MISSING_FORM_DATA_EXCEPTION_KEY, ex);
              return null;
          }

