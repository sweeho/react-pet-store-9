findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
    description: >
      SignOffEvent is mapped to SignOffEJBAction, but no SignOffEJBAction or SignOffEvent source exists in this module's tree (and the
      signon_error.screen named in signon-config.xml was not found among the screen definitions read). Whether these live in a shared module or are dead mappings needs a human check.
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/item.jsp
    description: >
      The user guide says an item shows a "List Price" and a discounted "Your Price" for members, while the order action charges item.getUnitCost() to every customer. item.jsp pricing logic was not examined in this pass, so it is not known which figure drives the order total or whether member discounts exist.
