  - record_key: ORDER-CHECKOUT-REQ-0003
    kind: workflow
    capability_key: order-checkout
    requirement: >
      The system SHALL, when an order is submitted, assign a new unique order identifier, build a purchase order
      carrying the user id, billing e-mail, order date, shipping and billing contacts, card, locale, one numbered line per cart item (category, product, item, quantity, unit cost) and the total price, and SHALL send it as an XML message asynchronously for order processing.
    confidence: medium
    confidence_basis: >
      One clear place (OrderEJBAction); the user guide describes the asynchronous hand-off in prose. The total
      being a sum of quantity times unit cost is read, not described by any document.
    risk_class: financial
    basis: >
      OrderEJBAction.perform iterates cart items, accumulates cost*quantity into a float total, then sends purchaseOrder.toXML() through AsyncSender.
    plain_text: >
      Placing an order records who bought what and for how much, and passes it on for approval and fulfilment without making the customer wait.
    technical_note: >
      Order id from UniqueIdGenerator seeded "1001". Total is accumulated as float. Line item index is 0-based.
      Message goes to the order-processing center queue (outside this module).
    interface: true
    stack_metadata:
      ejb.bean: ShoppingControllerEJB / AsyncSender
      ejb.transaction: Required
      jms.queue: via AsyncSender (OPC order queue, see runbook)
    traces:
