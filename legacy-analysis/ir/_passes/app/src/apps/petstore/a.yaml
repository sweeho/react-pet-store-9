  - record_key: SC-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN a cart update in which a quantity is not a whole number, WHEN the cart is updated, THEN the system SHALL treat that quantity as 0.
    confidence: medium
    confidence_basis: One clear place, the quantity parse. What a quantity of 0 does to the line is decided in the cart bean, which is outside this module.
    risk_class: operational
    basis: A NumberFormatException on parsing itemQuantity_ values is caught and 0 is substituted.
    plain_text: If a shopper types something that is not a number as a quantity, it counts as zero.
    technical_note: CartHTMLAction update branch. Whether a 0 quantity removes the line is not visible in this module.
