  - record_key: SC-BR-0004
    kind: business-rule
    capability_key: shopping-cart
    requirement: GIVEN a cart with no items, WHEN the shopper submits an order, THEN the system SHALL reject the order with an empty-cart error and SHALL show the empty-cart error screen.
    confidence: high
    confidence_basis: The check, the dedicated exception, its screen mapping and a screen definition all exist.
    risk_class: operational
    basis: OrderEJBAction throws ShoppingCartEmptyOrderException when the cart has zero items and mappings.xml routes it to cart_empty_order_error.screen.
    plain_text: A shopper whose cart is empty cannot place an order and is told so.
    technical_note: Check runs after the order number has already been drawn from the id generator, so a rejected order still consumes a number.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 130
        line_end: 132
        excerpt: |
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
