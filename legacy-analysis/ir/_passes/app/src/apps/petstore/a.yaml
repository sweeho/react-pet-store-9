records:
  - record_key: CB-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL list categories, the products of a category and the items of a product in the shopper's locale, ordered by name where a list is returned, and SHALL show a single category, product or item in that locale.
    confidence: medium
    confidence_basis: Stated in the catalog query configuration and described in the user guide; the Java catalog code that runs the queries is outside this module, so no second enforcement point was seen.
    risk_class: presentational
    basis: Each catalog query joins the base table to its details table and filters on locale.
    plain_text: Shoppers see categories, products and items in their own language, and category and product lists are sorted by name.
    technical_note: CatalogDAOSQL.xml holds the GET_CATEGORY, GET_CATEGORIES, GET_PRODUCT, GET_PRODUCTS, GET_ITEM and GET_ITEMS statements for the cloudscape and oracle databases. Each page's sidebar sets the catalog helper locale (en_US in sidebar.jsp, ja_JP in ja/sidebar.jsp).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
        excerpt: |
          <SQLStatement method="GET_CATEGORIES">
              <SQLFragment parameterNb="1">
                  select a.catid, name, descn
                      from (category a join category_details b on a.catid=b.catid) 
                      where locale = ? order by name
              </SQLFragment>
          </SQLStatement>
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1 (2.2 Browsing and searching)
    stack_metadata:
      framework: JSP/JSTL, fast-lane JDBC DAO
      db.object: category, category_details, product, product_details, item, item_details
  - record_key: CB-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL page catalog lists, showing 2 rows per page by default with Next and Previous navigation.
    confidence: medium
    confidence_basis: Default count of 2 is a literal in the product page and matches the user guide; the home sidebar uses a different literal (5) for its own list, so the rule is not uniform.
    risk_class: presentational
    basis: product.jsp falls back to a count of 2 when no count parameter is supplied.
    plain_text: Product and item lists show two rows at a time, with Next and Previous links.
    technical_note: product.jsp sets catalog.count to param.count or the literal 2. sidebar.jsp sets count 5 and start 0.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/product.jsp
        line_start: 66
        line_end: 72
        excerpt: |
          <c:when test="${param.count != null}">
          <c:set value="${param.count}" target="${catalog}" property="count"/>
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1 (2.2 Browsing and searching)
    stack_metadata:
      jsp.page: product.jsp
  - record_key: CB-REQ-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL search items case-insensitively, matching each entered word as a substring of the product name, the category identifier or the item description in the shopper's locale, and SHALL return an item that matches any of the words.
    confidence: high
    confidence_basis: The query text implements it and the user guide states the same behaviour in prose.
    risk_class: presentational
    basis: SEARCH_ITEMS lower-cases name, catid and description and ORs one repeated fragment per extra word.
    plain_text: A search finds items whose product name, category or description contains any of the words typed, ignoring upper and lower case.
    technical_note: SEARCH_ITEMS in CatalogDAOSQL.xml composes one ONCE fragment plus a VARIABLE fragment per extra keyword. The user guide says it matches product name, category and item description.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 119
        line_end: 123
        excerpt: |
          where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
          </SQLFragment>
          <SQLFragment parameterNb="3" occurrence="VARIABLE">
          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1 (2.2 Browsing and searching)
    stack_metadata:
      db.object: item, item_details, product_details, product
  - record_key: CB-REQ-0004
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL show two prices on the item page, the list price and the member price taken from the item's unit cost, each formatted as currency.
    confidence: medium
    confidence_basis: One page renders both values and the user guide describes them; the meaning of "member" discount is documented only, with no discount logic seen in this module.
    risk_class: financial
    basis: item.jsp prints listCost as List Price and unitCost as Your Price. The cart and the order total use unitCost.
    plain_text: Each item shows a shelf price and a lower price for members, and the member price is what is charged.
    technical_note: item.jsp forces fmt:setLocale en_US so the currency format is US dollars on every locale's copy of the default page.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/item.jsp
        line_start: 66
        line_end: 70
        excerpt: |
          <b>List Price:</b>
          <fmt:formatNumber value="${item.listCost}" type="currency" />
          <br><br>
          <b>Your Price:</b>
          <fmt:formatNumber value="${item.unitCost}" type="currency" />
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1 (2.3 Item prices)
    stack_metadata:
      jsp.page: item.jsp
