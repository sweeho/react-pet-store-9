    risk_class: financial
    basis: OrderEJBAction accumulates totalCost in a float from item.getUnitCost().
    plain_text: The order total is each item's member price times quantity, added up.
    technical_note: Arithmetic in float; unit cost parsed from string via new Float(). Line numbers start at 0.
