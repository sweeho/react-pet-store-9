    technical_note: CustomerHTMLAction.extractContactInfo; on missing fields returns null contact info and sets MISSING_FORM_DATA_EXCEPTION_KEY.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 245
        line_end: 249
