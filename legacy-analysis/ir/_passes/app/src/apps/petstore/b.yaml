records:
  - record_key: CAT-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL let a shopper navigate from a category to its products, from a product to its items, and from an item to its detail, in the shopper's selected locale.
    confidence: medium
    confidence_basis: The locale-filtered category/product/item queries are one clear place; the user guide describes the same navigation, but I did not read the servlet that runs the queries.
    risk_class: presentational
    basis: Catalog queries filter every level by locale and join the details tables; the user guide describes the drill-down.
    plain_text: Shoppers can open a category, then a product, then an item, and see everything in their own language.
    technical_note: CatalogDAOSQL.xml statements GET_CATEGORIES, GET_PRODUCTS, GET_ITEMS, GET_ITEM all take locale as the first bind parameter; consumed by the web-tier fast-lane DAO.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 119
        line_end: 119
        excerpt: |
          where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.2 Browsing and searching"
    stack_metadata:
      framework: JSP/JSTL, JDBC fast-lane reader
      db.object: category_details, product_details, item_details
  - record_key: CAT-REQ-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL search items case-insensitively by matching each entered word against product name, category identifier and item description, returning items that match ANY of the words.
    confidence: high
    confidence_basis: SQL (lower() with LIKE, repeated OR fragment per extra word) and the user guide both state it; Oracle variant repeats the same logic.
    risk_class: presentational
    basis: SEARCH_ITEMS builds one OR-group per search word over lower(name), lower(catid), lower(descn).
    plain_text: Searching is not case-sensitive; it looks in the product name, category and item description and shows items matching any of the words typed.
    technical_note: SEARCH_ITEMS SQLFragment with occurrence=VARIABLE appended once per extra keyword, for both cloudscape and oracle entries.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 122
        line_end: 122
        excerpt: |
          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.2 Browsing and searching"
    stack_metadata:
      db.object: item, item_details, product_details
  - record_key: CAT-REQ-0003
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL list categories, products and items two rows per page with Next and Previous navigation.
    confidence: medium
    confidence_basis: Page size 2 is a literal in category.jsp, confirmed by the user guide; I checked only the category page, not product/item/search pages.
    risk_class: presentational
    basis: category.jsp defaults count to 2 and passes count=2 in paging links.
    plain_text: Lists show two rows at a time, with Next and Previous links.
    technical_note: category.jsp c:set count default 2 and c:param count 2.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/category.jsp
        line_start: 122
        line_end: 122
        excerpt: |
          <c:param name="count" value="2"/>
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.2 Browsing and searching"
  - record_key: CAT-REQ-0004
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL show on the item page both the list price and the member ("your") price of the item, formatted as currency for the locale.
    confidence: high
    confidence_basis: JSP code and the user guide section 2.3 agree.
    risk_class: financial
    basis: item.jsp renders item.listCost as List Price and item.unitCost as Your Price.
    plain_text: Each item shows a normal shelf price and a lower member price.
    technical_note: item.jsp fmt:formatNumber of listCost and unitCost; DAO columns listprice and unitcost. The order total later uses unitCost.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/item.jsp
        line_start: 66
        line_end: 70
        excerpt: |
          <td class="petstore" width="100%"><b>List Price:</b>
           <fmt:formatNumber value="${item.listCost}" type="currency" />
           <br><br>
           <b>Your Price:</b>
           <fmt:formatNumber value="${item.unitCost}" type="currency" />
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.3 Item prices"
  - record_key: CART-REQ-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL support adding an item to the cart, removing an item, and updating the quantity of items, where a non-numeric quantity entered on update is treated as 0.
    confidence: high
    confidence_basis: Web action maps purchase/remove/update and the EJB action applies them (two places).
    risk_class: operational
    basis: CartHTMLAction translates action=purchase|remove|update into cart events; CartEJBAction applies add/delete/updateItemQuantity.
    plain_text: Customers can add items to the cart, remove them or change quantities; an unreadable quantity counts as zero.
    technical_note: CartHTMLAction parses itemQuantity_<id> params, catches NumberFormatException to 0. Whether quantity 0 removes the line is decided in the shopping cart component, not in this module.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CartHTMLAction.java
        line_start: 111
        line_end: 116
        excerpt: |
          try {
              quantity = new Integer(value);
          }
          catch (NumberFormatException nfe) {
              quantity = new Integer(0);
          }
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 1
        line_end: 1
        excerpt: |
          package com.sun.j2ee.blueprints.petstore.controller.ejb.actions;
    stack_metadata:
      framework: WAF front controller
      ejb.bean: ShoppingClientFacadeLocalEJB
  - record_key: CART-REQ-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: GIVEN the cart contains no items WHEN an order is submitted THEN the system SHALL reject the order and show the empty-cart order error screen, creating no purchase order.
    confidence: high
    confidence_basis: Check in order action plus exception-to-screen mapping.
    risk_class: operational
    basis: OrderEJBAction throws ShoppingCartEmptyOrderException; mappings.xml routes it to cart_empty_order_error.screen.
    plain_text: An order cannot be placed with an empty cart; the customer sees an error page.
    technical_note: The check occurs after the order id is generated and before the message is sent, so an order id is consumed by a rejected attempt.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 130
        line_end: 132
        excerpt: |
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 110
        line_end: 110
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.ShoppingCartEmptyOrderException" screen="cart_empty_order_error.screen"/>
  - record_key: CART-REQ-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: The system SHALL empty the cart after an order has been handed off, and SHALL keep one cart per signed-in session.
    confidence: medium
    confidence_basis: cart.empty() is one clear call; per-session cart creation is lazy in the facade (one place).
    risk_class: operational
    basis: OrderEJBAction calls cart.empty() last; facade creates cart on first use.
    plain_text: After the order is placed the cart is cleared.
    technical_note: cart.empty() runs even if sending the order message failed (see defect).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 167
        line_end: 167
        excerpt: |
          cart.empty();
  - record_key: ACCT-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: The system SHALL require sign-on before a shopper can view or edit the customer profile, or enter order information.
    confidence: medium
    confidence_basis: Declared in signon-config.xml (one place); the filter implementing it lives outside this module.
    risk_class: regulated
    basis: security constraints list customer.screen, customer.do and enter_order_information.screen (and signon_welcome.screen). No roles are named, so any authenticated user passes.
    plain_text: Only signed-in customers can edit their account or enter checkout details.
    technical_note: signon-config.xml security-constraint entries; enforced by SignOnFilter on /*. Browsing, cart and search are unprotected.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 69
        line_end: 69
        excerpt: |
          <url-pattern>enter_order_information.screen</url-pattern>
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 61
        line_end: 61
        excerpt: |
          <url-pattern>customer.do</url-pattern>
    stack_metadata:
      framework: custom SignOnFilter
  - record_key: ACCT-REQ-0002
    kind: requirement
    capability_key: customer-account
    requirement: The system SHALL create a user account from a user name and password, and GIVEN the account cannot be created (name taken, bad name or password) THEN it SHALL show the duplicate-account screen.
    confidence: medium
    confidence_basis: One clear flow (action + exception mapping); the uniqueness check itself is in the sign-on component outside this module.
    risk_class: regulated
    basis: CreateUserEJBAction wraps CreateException and lookup failures as DuplicateAccountException; mappings route it to duplicate_account.screen.
    plain_text: A new user picks a name and password; if that fails the customer is told the account already exists.
    technical_note: Any lookup/creation failure, not only a true duplicate, produces the duplicate-account page.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 99
        line_end: 101
        excerpt: |
          } catch (CreateException ce) {
              throw new DuplicateAccountException("Bad UserName or password");
          }
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 111
        line_end: 111
        excerpt: |
          <exception-mapping exception-class="com.sun.j2ee.blueprints.petstore.controller.exceptions.DuplicateAccountException" screen="duplicate_account.screen"/>
  - record_key: ACCT-REQ-0003
    kind: requirement
    capability_key: customer-account
    requirement: The system SHALL capture, on account creation and update, family name, given name, street address, city, state or province, postal code and telephone as mandatory, with second address line and email optional.
    confidence: medium
    confidence_basis: Checked in the web action (one place); duplicated copy in OrderHTMLAction but that is a different flow. Missing-field list is recorded in a request attribute, but see defect on how it is consumed.
    risk_class: operational
    basis: extractContactInfo trims each field and collects labels of blanks; address_2 blank becomes null; country is not checked.
