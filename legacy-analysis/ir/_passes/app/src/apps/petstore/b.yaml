suspected_defects:
  - capability_key: order-checkout
    record_keys: [CHK-REQ-0001, CHK-REQ-0003]
    severity: high
    category: contradicts-document
    title: Order always carries a hard-coded credit card
    description: >
      The order web action ignores any card entered and always builds the card "1234-2334" / "Duke Express" / "10/2001",
      which is also already expired. The user guide says the form is pre-filled for the sample user and implies the entered data is used.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
        line_start: 82
        line_end: 82
        excerpt: |
          CreditCard creditCard = new CreditCard( "1234-2334", "Duke Express", "10/2001") ;
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.5 Placing an order"
  - capability_key: customer-account
    record_keys: [CHK-REQ-0003, ACCT-REQ-0004]
    severity: medium
    category: other
    title: Credit card and profile required-field checks never reject anything
    description: >
      In extractCreditCard the type, expiry month and expiry year checks all test creditCardNumber instead of their own field,
      and the collected missingFields list is never thrown or stored. extractProfileInfo likewise collects missing language and favourite category but never reports them.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 151
        line_end: 153
        excerpt: |
          String creditCardType =  request.getParameter("credit_card_type").trim();
          if (creditCardNumber.equals("")) {
              if (missingFields == null) {
  - capability_key: customer-account
    record_keys: [ACCT-REQ-0002]
    severity: medium
    category: other
    title: Password confirmation is read but not compared
    description: >
      CreateUserHTMLAction reads a second password field but only checks that user name and password are not null;
      no equality check between the two passwords is visible, and a failure to create is always shown as a duplicate account.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CreateUserHTMLAction.java
        line_start: 84
        line_end: 86
        excerpt: |
          if (userName != null && password != null) {
              return new CreateUserEvent(userName,password);
          }
  - capability_key: order-checkout
    record_keys: [CHK-INT-0001, CART-REQ-0003]
    severity: high
    category: error-swallowed
    title: Failure to send the order is only printed, yet the cart is emptied and success returned
    description: >
      Lookup, XML and create exceptions around the send are caught and printed; execution continues to empty the cart and return an order id, so the customer is told the order succeeded though nothing reached the OPC.
      A failed id generator lookup also leaves uidgen null and causes a NullPointerException.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 155
