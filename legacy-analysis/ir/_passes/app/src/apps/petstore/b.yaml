  - record_key: CHK-RULE-0001
    kind: business-rule
    capability_key: order-checkout
    requirement: The system SHALL price an order as the sum over cart lines of unit (member) price times quantity, and SHALL record each line with category, product, item, line number, quantity and unit price.
