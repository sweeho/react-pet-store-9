suspected_defects:
  - capability_key: admin-order-management
    record_keys: [AOM-REQ-0001, AOM-REQ-0004]
    severity: medium
    category: error-swallowed
    title: Failed order and chart queries return an empty (null) response
    description: >
      When the business delegate fails, getOrders and getChartInfo print the stack trace and return null, so the client receives no error message, unlike updateOrders which returns an Error element.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 199
        line_end: 202
  - capability_key: admin-order-management
    record_keys: [AOM-REQ-0002]
    severity: high
    category: other
    title: Server accepts any status for any order without checking current state
    description: >
      updateOrders forwards whatever status the request carries (the comment assumes statuses match) with no check of the order's current status or that the value is APPROVED/DENIED; the pending-only rule lives only in the client. The client also ignores a non-SUCCESS reply (empty branch).
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 216
        line_end: 223
      - path: legacy-source/app/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/HttpPostPetStoreProxy.java
        line_start: 413
        line_end: 415
  - capability_key: customer-account
    record_keys: [AOM-REQ-0005]
    severity: medium
    category: other
    title: Data servlet not covered by the security constraint
    description: >
      The constraint protects /AdminRequestProcessor only; /ApplRequestProcessor, which lists and updates orders, is checked only for a non-null session, so any session (not necessarily administrator) may reach it. Also reads/launches use transport guarantee NONE.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 80
findings: []
