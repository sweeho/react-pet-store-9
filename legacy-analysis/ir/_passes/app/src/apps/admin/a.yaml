      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 120
        line_end: 120
        excerpt: |
          sender.sendAMessage(oa.toXML());
    stack_metadata:
      framework: servlet
      ejb.bean: AsyncSender
      jms.queue: via AsyncSender (queue name not in this module)
