  - record_key: ADM-BR-0009
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL hold orders over the regional limit as PENDING until an administrator approves or denies them; the admin module itself applies no limit.
    confidence: medium
    confidence_basis: Stated in documents; the limit is not in this module, and the two documents give different figures (see conflict).
    dispute:
      reason: contradicts-docs
      detail: >
        User guide says orders above $500 are pending; runbook says limits are US 500 and JP 50000. Confirm in the order-processing module.
    risk_class: financial
    basis: Documents only; no limit code exists in the admin module.
    plain_text: Large orders wait for an administrator's decision; small ones are approved automatically.
    technical_note: Threshold logic lives outside the admin module (order-processing application); the admin client only handles the PENDING list.
    interface: false
    traces:
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        kind: document
        anchor: p1 (section 3.3)
        excerpt: |
          An order is pending if its total value is greater than $500.
      - path: legacy-analysis/sources/pdf/petstore-operations-runbook/extracted.md
        kind: document
        anchor: p1 (section 1.1 Order flow)
        excerpt: |
          total under limit (US 500, JP 50000)  --> APPROVED automatically
    stack_metadata:
      framework: documentation
