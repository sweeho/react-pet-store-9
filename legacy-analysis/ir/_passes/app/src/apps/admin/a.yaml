records:
  - record_key: ADM-REQ-0001
    kind: requirement
    capability_key: admin-order-management
    requirement: >
      The system SHALL restrict the administration order-management entry point to authenticated users holding the administrator role, using a form-based login.
    confidence: high
    confidence_basis: >
      Declared in web.xml (security constraint, role, login config) and the user guide describes an order administrator; but the constraint covers only one of two servlets (see defect).
    risk_class: regulated
    basis: web.xml constrains GET and POST on the admin launcher URL to role administrator, with FORM login.
    plain_text: Only people with the administrator role can sign in to the order administration tool, through a login form.
    technical_note: web.xml security-constraint on /AdminRequestProcessor, login-config FORM (login.jsp / error.jsp), transport-guarantee NONE (no TLS required).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 97
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
    stack_metadata:
      framework: servlet
      jsp.page: login.jsp
  - record_key: ADM-REQ-0002
    kind: requirement
    capability_key: admin-order-management
    requirement: >
      The system SHALL expire an administrator session after 54 minutes of inactivity.
    confidence: low
    confidence_basis: Bare configuration literal with no comment or document stating the intent.
    risk_class: operational
    basis: session-timeout configured in web.xml.
    plain_text: An administrator's session ends after 54 minutes without activity.
    technical_note: web.xml session-config session-timeout 54.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      framework: servlet
      session.scope: http-session
