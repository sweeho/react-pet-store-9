  - record_key: ADM-REQ-0006
    kind: requirement
    capability_key: admin-order-management
    requirement: >
      The system SHALL apply an administrator's status changes by publishing one approval message containing every (order id, status) pair with both values present, asynchronously, and reply SUCCESS once the message is handed off.
    confidence: high
    confidence_basis: Seen in the web relay and the business delegate; the downstream effect is outside this module.
    risk_class: financial
    basis: ApplRequestProcessor.updateOrders skips entries lacking id or status, then AdminRequestBD.updateOrders sends OrderApproval XML through AsyncSender.
    plain_text: Approval and denial decisions are passed on to order processing in the background; the tool is told success once they have been handed over, not once they are applied.
    technical_note: UPDATESTATUS request; entries missing OrderId or OrderStatus are silently skipped; message sent via local AsyncSender EJB. Status values are assumed equal across both schemas (code comment); not validated against the four known statuses.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 220
        line_end: 235
