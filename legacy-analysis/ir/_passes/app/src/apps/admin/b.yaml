suspected_defects:
  - capability_key: admin-order-management
    record_keys: [AOM-REQ-0001, AOM-REQ-0004, AOM-INT-0008, AOM-REQ-0009]
    severity: high
    category: other
    title: Data endpoint is not covered by the administrator-role constraint
    description: >
      web.xml restricts only /AdminRequestProcessor to the administrator role. /ApplRequestProcessor, which lists orders and posts approvals, has no security constraint; it only requires that some HTTP session exist (getSession(false) != null). Any caller holding any session id could invoke approvals. Transport guarantee is NONE, and the session id is passed in clear as a launch argument.
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <url-pattern>/AdminRequestProcessor</url-pattern>
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 91
        line_end: 94
        excerpt: |
          // Check session; if null then there is no authentication;
  - capability_key: admin-order-management
    record_keys: [AOM-REQ-0004, AOM-REQ-0009]
    severity: medium
    category: error-swallowed
    title: Backend failures return an empty (null) response instead of an error
    description: >
      getOrders and getChartInfo catch AdminBDException, print the stack trace and return null, so the client gets an empty body rather than the <Error> element used for other failures. Update failures do return an error.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 172
        line_end: 175
        excerpt: |
          catch (AdminBDException e) {
              e.printStackTrace();
              return null;
          }
  - capability_key: admin-order-management
    record_keys: [AOM-INT-0008]
    severity: medium
    category: data-corruption
    title: Approval status values and order state are not validated server-side
    description: >
      UPDATESTATUS forwards any status string for any order id; only the Swing client limits choices to APPROVED/DENIED. A reply of SUCCESS means only that the message was queued.
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 183
        line_end: 197
        excerpt: |
          // Assumes values of OrderStatus are the same for both schemas
  - capability_key: inventory-reporting
    record_keys: [AOM-REQ-0009]
    severity: low
    category: inconsistent-rounding
    title: Revenue totalled in single-precision float
    description: >
      Revenue amounts and their total are summed as float, which can lose cents on large totals; no rounding rule is stated.
