findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >
      The $500 auto-approval threshold (user guide) is not implemented in the admin module; it belongs to the order center. Not recorded here. getProperDate also throws unchecked on malformed dates (not caught) - behaviour unspecified.
