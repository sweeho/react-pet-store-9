records:
  - record_key: AOM-REQ-0001
    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL restrict the admin order-management entry point to users holding the administrator role, using a form-based sign-in page, and SHALL expose a logout screen.
    confidence: high
    confidence_basis: Declared in web.xml (security-constraint, login-config) and reflected by login.jsp/error.jsp; two places.
    risk_class: regulated
    basis: web.xml constrains /AdminRequestProcessor (GET and POST) to role administrator with FORM login; login.jsp posts to j_security_check.
    plain_text: Only administrators can use the order administration tool, and they must sign in with a user ID and password first.
    technical_note: Container-managed FORM auth. Login form pre-fills user id "jps_admin". Transport guarantee NONE (no TLS required). Session timeout 54 minutes.
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 100
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
      - path: legacy-source/app/src/apps/admin/src/docroot/login.jsp
        line_start: 52
        line_end: 52
        excerpt: |
          <form action="j_security_check" method=post>
    stack_metadata:
      framework: servlet-form-auth
      jsp.page: login.jsp
      session.scope: http-session
  - record_key: AOM-REQ-0002
    kind: requirement
    capability_key: admin-order-management
    requirement: The system SHALL expire an admin session after 54 minutes of inactivity.
    confidence: low
    confidence_basis: Bare literal in web.xml; no comment or document gives a reason.
    risk_class: operational
    basis: session-timeout 54 declared; no authoritative source for the value.
    plain_text: An administrator is signed out after 54 minutes of inactivity.
    technical_note: web.xml session-config session-timeout=54 (minutes).
    interface: false
    traces:
      - path: legacy-source/app/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 67
        line_end: 69
        excerpt: |
          <session-config>
            <session-timeout>54</session-timeout>
          </session-config>
    stack_metadata:
      framework: servlet
      session.scope: http-session
  - record_key: AOM-WFL-0003
    kind: workflow
    capability_key: admin-order-management
    requirement: The system SHALL, on the admin page, offer a "manage orders" action that launches the rich admin client, handing it the server host, port and the current session identifier, and a "logout" action that shows the logout screen.
