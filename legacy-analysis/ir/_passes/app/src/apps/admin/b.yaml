  - record_key: AOM-INT-0008
    kind: integration
    capability_key: admin-order-management
    requirement: The system SHALL, for an UPDATESTATUS request, convert each order id and new status into an order-approval message and send it asynchronously to the order processing center, and SHALL reply SUCCESS once the message is handed off.
    confidence: high
    confidence_basis: Servlet and business delegate both implement it; user guide says OPC receives approvals. SUCCESS only means queued, not applied.
    risk_class: financial
    basis: updateOrders builds OrderApproval of ChangedOrder(orderId, status); AdminRequestBD.updateOrders sends oa.toXML() via the AsyncSender.
    plain_text: When approvals or denials are committed, they are sent to the order processing center in the background, and the administrator is told the update succeeded.
    technical_note: Orders lacking id or status are silently skipped. Status values are passed through unvalidated (assumes both schemas share values). No server-side check that status is APPROVED/DENIED or that order was PENDING.
    interface: true
    traces:
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 177
        line_end: 213
        excerpt: |
          OrderApproval oa = new OrderApproval();
          ...
          if (orderId != null && orderStatus != null) { oa.addOrder(new ChangedOrder(orderId, orderStatus)); }
          ...
          bd.updateOrders(oa);
          return replyHeader + "<Type>UPDATEORDERS</Type>\n" + "<Status>SUCCESS</Status>\n"
      - path: legacy-source/app/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 235
        line_end: 250
        excerpt: |
          AsyncSender sender= home.create();
          sender.sendAMessage(oa.toXML());
    stack_metadata:
      framework: servlet
      jms.queue: via AsyncSender EJB
      ejb.bean: AsyncSenderEJB
