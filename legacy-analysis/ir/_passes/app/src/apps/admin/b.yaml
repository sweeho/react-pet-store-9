    risk_class: operational
    basis: doPost dispatches on the currentScreen parameter; "manageorders" returns a launch descriptor, "logout" forwards to logout.jsp. Any other value (or none) yields no response body.
    plain_text: From the admin home page an administrator can start the order management tool or log out.
    technical_note: Returns JNLP (application/x-java-jnlp-file) with codebase http://host:port/admin, argument list proxy class, host, port, session id. Requires Java 1.3/1.4.
