suspected_defects:
  - capability_key: localization
    record_keys: [LOC-BR-0002, LOC-REQ-0001]
    severity: medium
    category: data-corruption
    title: Locale parser ignores variants and mishandles malformed codes
    description: >
      The parser assigns the variant index only as -1 and never sets it, so a three-part code such as en_US_variant loses its variant. A code ending in an underscore ("en_") gives an empty country rather than a rejection. The country is only set when there is no second underscore, so with a variant present the country is null.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 173
        line_end: 192
  - capability_key: localization
    record_keys: [LOC-REQ-0007, LOC-REQ-0006]
    severity: low
    category: error-swallowed
    title: Encoding and keyword errors are swallowed
    description: >
      An unsupported-encoding error is silently ignored and null returned; keyword parsing returns null after a debug print.
    traces:
      - path: legacy-source/app/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 73
        line_end: 75
  - capability_key: localization
    record_keys: [LOC-BR-0005]
    severity: low
    category: other
    title: Fallback can fail if default locale has no screens
    description: >
      If the default locale has no screen definitions loaded, the fallback dereferences a null result and fails. The mappings file also names a ChangeLocaleEvent class under a different package (waf.event.events) than the class in the source tree (waf.event.impl), so the event mapping may not match.
    traces:
      - path: legacy-source/app/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 238
        line_end: 240
      - path: legacy-source/app/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 44
        line_end: 44
findings:
  - kind: ambiguity
    path: legacy-source/app/src/waf/src/docroot/WEB-INF/xml/requestmappings.xml
    description: >
      The generic framework also carries a URL mapping table, template engine, form tags and an EJB state machine. They have no business rule in themselves and were not made records. A human should confirm that the framework mechanics are out of scope for requirements.
